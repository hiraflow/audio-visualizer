
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spectrum Visualizer X</title>

<style>
:root {
  --bg:#050711;
  --panel:rgba(12,17,36,.96);
  --line:rgba(150,170,255,.18);
  --text:#e9edff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
button,input,select{font:inherit}
#app{
  position:relative;width:100%;height:100%;height:100dvh;
  overflow:hidden;background:#050711;
}
#visualArea{position:absolute;inset:0;overflow:hidden;touch-action:manipulation}
canvas{width:100%;height:100%;display:block}
.header{
  position:absolute;top:max(18px,env(safe-area-inset-top));
  left:22px;z-index:5;pointer-events:none;transition:opacity .35s;
}
.header h1{
  margin:0;font-size:13px;font-weight:600;letter-spacing:4px;
  color:rgba(225,232,255,.8);
}
.header p{
  margin:5px 0 0;font-size:9px;letter-spacing:2px;color:#687397;
}
.status{
  position:absolute;left:22px;bottom:max(22px,env(safe-area-inset-bottom));
  z-index:5;font-size:10px;letter-spacing:1.5px;color:#7683aa;
  pointer-events:none;transition:opacity .35s;
}
.status span{color:#aab7ff}
.toolbar{
  position:absolute;z-index:30;top:max(16px,env(safe-area-inset-top));
  right:16px;display:flex;gap:8px;align-items:center;
  transition:opacity .35s,transform .35s;
}
.btn{
  border:1px solid rgba(160,175,255,.2);
  background:rgba(18,24,48,.84);color:#e7ebff;
  border-radius:12px;padding:11px 14px;font-size:12px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  cursor:pointer;
}
.btn.primary{
  background:rgba(103,119,226,.28);
  border-color:rgba(145,160,255,.4);
}
.btn:active{transform:scale(.96)}
.iconBtn{
  width:42px;height:42px;padding:0;font-size:17px;
  display:grid;place-items:center;
}
.settings{
  position:absolute;z-index:25;
  top:max(70px,calc(env(safe-area-inset-top) + 62px));
  right:16px;width:min(320px,calc(100vw - 32px));
  max-height:calc(100dvh - 100px);overflow-y:auto;
  padding:20px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 18px 60px rgba(0,0,0,.4);display:none;
}
.settings.open{display:block}
.settings h2{font-size:13px;letter-spacing:2px;margin:0 0 20px}
.setting{margin:20px 0}
.settingHead{
  display:flex;justify-content:space-between;font-size:11px;
  color:#b7c1e5;margin-bottom:11px;
}
.settingHead output{color:#aab7ff;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#929fff;height:5px;cursor:pointer}
.rangeEnds,.rangeScale{
  display:flex;justify-content:space-between;font-size:9px;margin-top:6px;
}
.rangeEnds{color:#687397}
.rangeScale{color:#8792b5;margin-top:5px}
select{
  width:100%;padding:12px;color:#e9edff;
  background:rgba(35,43,76,.85);
  border:1px solid rgba(150,170,255,.2);
  border-radius:10px;outline:none;font-size:12px;
}
select option{background:#151b31;color:#e9edff}
.settingDescription{
  margin-top:9px;font-size:10px;line-height:1.6;color:#7885aa;
}
#app.fullscreen .header,#app.fullscreen .status{opacity:0}
#app.fullscreen.controlsHidden .toolbar{
  opacity:0;pointer-events:none;transform:translateY(-8px);
}
#app.fullscreen.controlsHidden .header,
#app.fullscreen.controlsHidden .status{opacity:0}
.centerMessage{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:4;transition:opacity .4s;
}
.centerMessage strong{
  display:block;font-size:11px;letter-spacing:3px;font-weight:500;
  color:rgba(190,202,255,.7);
}
.centerMessage small{
  display:block;margin-top:8px;font-size:9px;letter-spacing:1px;
  color:rgba(130,145,190,.55);
}
.centerMessage.hidden{opacity:0}
@media(max-width:600px){
  .header,.status{left:15px}
  .toolbar{right:12px}
  .btn{padding:10px 11px}
  .iconBtn{width:40px;height:40px}
}
</style>
</head>

<body>
<div id="app">
  <div id="visualArea"><canvas id="canvas"></canvas></div>

  <div class="header">
    <h1>SPECTRUM</h1>
    <p>AUDIO VISUALIZER X</p>
  </div>

  <div class="status">INPUT : <span id="statusText">WAITING</span></div>

  <div class="centerMessage" id="centerMessage">
    <strong>READY TO VISUALIZE</strong>
    <small>START MICROPHONE TO BEGIN</small>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="micBtn">マイク開始</button>
    <button class="btn iconBtn" id="settingsBtn">⚙</button>
    <button class="btn iconBtn" id="fullscreenBtn">⛶</button>
  </div>

  <div class="settings" id="settings">
    <h2>VISUALIZER SETTINGS</h2>

    <div class="setting">
      <div class="settingHead"><label for="effectSelect">演出モード</label></div>
      <select id="effectSelect">
        <option value="spectrum">Spectrum X</option>
        <option value="mirror">Mirror Pulse</option>
        <option value="wave">Wave Flow</option>
        <option value="radial">Hyper Radial</option>
        <option value="particles">Particle Storm</option>
      </select>
      <div class="settingDescription" id="effectDescription">
        立体バーと残光を組み合わせたスペクトラム
      </div>
    </div>

    <div class="setting">
      <div class="settingHead">
        <label for="gain">入力レベル</label><output id="gainValue">300%</output>
      </div>
      <input id="gain" type="range" min="0" max="100" step="1" value="50">
      <div class="rangeEnds"><span>0%</span><span>300%</span><span>600%</span></div>
      <div class="rangeScale"><span>最小</span><span>標準</span><span>最大</span></div>
    </div>

    <div class="setting">
      <div class="settingHead">
        <label for="sensitivity">感度</label><output id="sensitivityValue">150%</output>
      </div>
      <input id="sensitivity" type="range" min="0" max="100" step="1" value="50">
      <div class="rangeEnds"><span>0%</span><span>150%</span><span>300%</span></div>
      <div class="rangeScale"><span>最小</span><span>標準</span><span>最大</span></div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const app = $("app");
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const settings = $("settings");
const micBtn = $("micBtn");

let audioContext=null,source=null,gainNode=null,analyser=null;
let stream=null,frequencyData=null;
let width=0,height=0,dpr=1;
let smoothData=[],peakData=[];
let particles=[],shockwaves=[];
let isRunning=false;
let gainValue=3,sensitivity=1.5;
const smoothing=.72;
let hideTimer=null;
let globalGlow=0,lowEnergy=0,previousLow=0;
let flash=0,animationTime=0;
let currentEffect="spectrum";
let lastBeat=0;

const BAR_COUNT=100;
const MIN_HZ=35;
const MAX_HZ=12000;

const descriptions={
  spectrum:"立体バー、強い発光、ピークの残像を組み合わせた表示",
  mirror:"上下に広がる波と低音連動の衝撃波",
  wave:"複数の光の帯が重なりながら流れる表示",
  radial:"多重リングと回転する円形スペクトラム",
  particles:"音に合わせて粒子が放射状に広がる表示"
};

$("effectSelect").addEventListener("change",e=>{
  currentEffect=e.target.value;
  $("effectDescription").textContent=descriptions[currentEffect];
  smoothData.fill(0);
  peakData.fill(0);
  particles=[];
  shockwaves=[];
});

function updateGainFromSlider(){
  gainValue=Number($("gain").value)/50*3;
  $("gainValue").textContent=Math.round(gainValue*100)+"%";
  if(gainNode&&audioContext){
    gainNode.gain.setTargetAtTime(gainValue,audioContext.currentTime,.04);
  }
}
function updateSensitivityFromSlider(){
  sensitivity=Number($("sensitivity").value)/50*1.5;
  $("sensitivityValue").textContent=Math.round(sensitivity*100)+"%";
}
$("gain").addEventListener("input",updateGainFromSlider);
$("sensitivity").addEventListener("input",updateSensitivityFromSlider);
updateGainFromSlider();
updateSensitivityFromSlider();

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  width=rect.width;height=rect.height;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(width*dpr));
  canvas.height=Math.max(1,Math.round(height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  smoothData=new Array(BAR_COUNT).fill(0);
  peakData=new Array(BAR_COUNT).fill(0);
}
if("ResizeObserver" in window){
  new ResizeObserver(resizeCanvas).observe($("visualArea"));
}else{
  window.addEventListener("resize",resizeCanvas);
}
resizeCanvas();

async function startMicrophone(){
  try{
    micBtn.textContent="接続中...";
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("この環境ではマイクを利用できません。HTTPS接続を確認してください。");
    }
    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }
    if(audioContext){
      try{await audioContext.close()}catch(e){}
    }
    isRunning=false;
    stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    audioContext=new AudioContextClass();
    if(audioContext.state==="suspended") await audioContext.resume();

    source=audioContext.createMediaStreamSource(stream);
    gainNode=audioContext.createGain();
    gainNode.gain.value=gainValue;

    analyser=audioContext.createAnalyser();
    analyser.fftSize=4096;
    analyser.minDecibels=-100;
    analyser.maxDecibels=-20;
    analyser.smoothingTimeConstant=0;

    source.connect(gainNode);
    gainNode.connect(analyser);
    frequencyData=new Uint8Array(analyser.frequencyBinCount);

    smoothData=new Array(BAR_COUNT).fill(0);
    peakData=new Array(BAR_COUNT).fill(0);
    particles=[];
    shockwaves=[];
    globalGlow=0;
    isRunning=true;

    $("statusText").textContent="CONNECTED";
    $("centerMessage").classList.add("hidden");
    micBtn.textContent="マイク接続済み";
  }catch(error){
    console.error(error);
    $("statusText").textContent="ERROR";
    micBtn.textContent="マイク開始";
    alert("マイクを取得できませんでした。\n\n"+error.message);
  }
}
micBtn.addEventListener("click",startMicrophone);

function getBarValue(index){
  if(!analyser||!audioContext||!frequencyData)return 0;
  const t1=index/BAR_COUNT;
  const t2=(index+1)/BAR_COUNT;
  const startHz=MIN_HZ*Math.pow(MAX_HZ/MIN_HZ,t1);
  const endHz=MIN_HZ*Math.pow(MAX_HZ/MIN_HZ,t2);
  const binWidth=audioContext.sampleRate/analyser.fftSize;
  const start=Math.max(0,Math.floor(startHz/binWidth));
  const end=Math.min(frequencyData.length-1,Math.max(start,Math.ceil(endHz/binWidth)));
  let sum=0,count=0;
  for(let i=start;i<=end;i++){sum+=frequencyData[i];count++}
  return count?sum/count:0;
}

function getLowFrequency(){
  if(!analyser||!audioContext||!frequencyData)return 0;
  const binWidth=audioContext.sampleRate/analyser.fftSize;
  const start=Math.floor(35/binWidth);
  const end=Math.ceil(250/binWidth);
  let sum=0,count=0;
  for(let i=start;i<=end;i++){sum+=frequencyData[i]||0;count++}
  return count?sum/count/255:0;
}

function getHue(i){
  const d=Math.abs((i/(BAR_COUNT-1))*2-1);
  return 220+(1-d)*48;
}

function roundedGlow(x,y,r,color){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);
  g.addColorStop(1,"rgba(50,70,180,0)");
  ctx.fillStyle=g;
  ctx.fillRect(x-r,y-r,r*2,r*2);
}

/* 背景と全体の音連動グロー */
function drawBackground(){
  const bg=ctx.createRadialGradient(
    width*.5,height*.48,0,width*.5,height*.48,Math.max(width,height)*.8
  );
  bg.addColorStop(0,"#141d42");
  bg.addColorStop(.48,"#090f25");
  bg.addColorStop(1,"#03050e");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,width,height);

  const g=ctx.createRadialGradient(
    width*.5,height*.52,0,width*.5,height*.52,width*.76
  );
  g.addColorStop(0,`rgba(75,110,255,${.09+globalGlow*.3})`);
  g.addColorStop(.5,`rgba(70,90,230,${.04+globalGlow*.16})`);
  g.addColorStop(1,"rgba(30,50,130,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,width,height);

  roundedGlow(width*.5,height*.55,width*.45,
    `rgba(95,130,255,${.025+globalGlow*.12})`);
}

/* 低音の衝撃波 */
function addShockwave(){
  shockwaves.push({radius:10,alpha:.8});
  if(shockwaves.length>8)shockwaves.shift();
}
function drawShockwaves(){
  const cx=width/2,cy=height*.53;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  shockwaves.forEach(s=>{
    s.radius+=2.2+lowEnergy*5;
    s.alpha*=.965;
    ctx.beginPath();
    ctx.arc(cx,cy,s.radius,0,Math.PI*2);
    ctx.strokeStyle=`rgba(115,155,255,${s.alpha*.48})`;
    ctx.lineWidth=1.5+s.alpha*2;
    ctx.shadowColor="rgba(105,145,255,.9)";
    ctx.shadowBlur=18;
    ctx.stroke();
  });
  shockwaves=shockwaves.filter(s=>s.alpha>.025&&s.radius<Math.max(width,height)*.8);
  ctx.restore();
}

/* Spectrum X */
function drawSpectrum(){
  const cx=width/2;
  const spread=width*.92;
  const baseY=height*.69;
  const maxH=Math.min(height*.5,Math.min(width,height)*.72);
  const bw=Math.max(2,spread/BAR_COUNT*.7);

  for(let i=0;i<BAR_COUNT;i++){
    const n=i/(BAR_COUNT-1);
    const distance=Math.abs(n*2-1);
    const curve=1-Math.pow(distance,1.6)*.18;
    const x=cx+(n-.5)*spread;
    const y=baseY+Math.pow(distance,2)*height*.035;
    const level=smoothData[i];
    const h=level*maxH*curve;
    const peak=peakData[i]*maxH*curve;
    const hue=getHue(i);

    /* 奥行きのある薄い背面バー */
    if(h>1){
      ctx.fillStyle=`hsla(${hue},100%,65%,.12)`;
      ctx.fillRect(x-bw*.9,y-h*.88,bw*1.8,h*.88);
    }

    if(h>.5){
      const grad=ctx.createLinearGradient(x,y-h,x,y);
      grad.addColorStop(0,`hsla(${hue+20},100%,94%,1)`);
      grad.addColorStop(.22,`hsla(${hue+5},100%,78%,.98)`);
      grad.addColorStop(.7,`hsla(${hue},95%,58%,.92)`);
      grad.addColorStop(1,`hsla(${hue-10},90%,35%,.8)`);

      ctx.save();
      ctx.shadowColor=`hsla(${hue},100%,70%,.95)`;
      ctx.shadowBlur=14+level*35;
      ctx.fillStyle=grad;
      ctx.fillRect(x-bw/2,y-h,bw,h);
      ctx.restore();

      /* バーの上部の輝点 */
      ctx.save();
      ctx.shadowColor="#b8d2ff";
      ctx.shadowBlur=14;
      ctx.fillStyle="rgba(220,235,255,.95)";
      ctx.fillRect(x-bw/2,y-h-1,bw,2);
      ctx.restore();
    }

    if(peak>3){
      ctx.fillStyle=`hsla(${hue+20},100%,90%,.85)`;
      ctx.fillRect(x-bw/2,y-peak-3,bw,2);
    }

    /* 床への反射 */
    if(level>.04){
      const ref=ctx.createLinearGradient(x,y,x,y+height*.15);
      ref.addColorStop(0,`hsla(${hue},100%,70%,${level*.25})`);
      ref.addColorStop(1,"rgba(70,100,255,0)");
      ctx.fillStyle=ref;
      ctx.fillRect(x-bw/2,y+2,bw,height*.15);
    }
  }

  /* 横方向の光のライン */
  const line=ctx.createLinearGradient(0,0,width,0);
  line.addColorStop(0,"rgba(100,130,255,0)");
  line.addColorStop(.5,"rgba(180,205,255,.65)");
  line.addColorStop(1,"rgba(100,130,255,0)");
  ctx.save();
  ctx.shadowColor="#809fff";
  ctx.shadowBlur=18;
  ctx.strokeStyle=line;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(0,baseY);
  ctx.quadraticCurveTo(cx,baseY-25,width,baseY);
  ctx.stroke();
  ctx.restore();
  drawShockwaves();
}

/* Mirror Pulse */
function drawMirror(){
  const cx=width/2,cy=height*.51;
  const spread=width*.92;
  const maxH=Math.min(height*.34,width*.42);
  const bw=Math.max(2,spread/BAR_COUNT*.7);

  for(let i=0;i<BAR_COUNT;i++){
    const x=cx-spread/2+i/BAR_COUNT*spread;
    const level=smoothData[i];
    const h=level*maxH;
    const hue=getHue(i);

    const grad=ctx.createLinearGradient(x,cy-h,x,cy+h);
    grad.addColorStop(0,`hsla(${hue+25},100%,90%,.98)`);
    grad.addColorStop(.35,`hsla(${hue},100%,70%,.95)`);
    grad.addColorStop(1,`hsla(${hue-15},90%,45%,.9)`);

    ctx.save();
    ctx.shadowColor=`hsla(${hue},100%,70%,.9)`;
    ctx.shadowBlur=12+level*30;
    ctx.fillStyle=grad;
    ctx.fillRect(x,cy-h,bw,h);
    ctx.fillRect(x,cy,bw,h);
    ctx.restore();

    const peak=peakData[i]*maxH;
    ctx.fillStyle=`hsla(${hue+20},100%,90%,.8)`;
    ctx.fillRect(x,cy-peak-2,bw,2);
    ctx.fillRect(x,cy+peak,bw,2);
  }

  /* 中央のエネルギーライン */
  ctx.save();
  ctx.shadowColor="#91b2ff";
  ctx.shadowBlur=22;
  ctx.strokeStyle="rgba(170,195,255,.8)";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(0,cy);
  ctx.lineTo(width,cy);
  ctx.stroke();
  ctx.restore();

  drawShockwaves();
}

/* Wave Flow */
function drawWave(){
  const cx=width/2,cy=height*.53;
  const spread=width*.95;
  const amp=Math.min(height*.32,width*.4);

  for(let layer=0;layer<5;layer++){
    const scale=1-layer*.15;
    const phase=animationTime*(.012+layer*.002)+layer*1.3;
    const offset=(layer-2)*height*.025;

    ctx.beginPath();
    for(let i=0;i<BAR_COUNT;i++){
      const x=cx-spread/2+i/(BAR_COUNT-1)*spread;
      const audio=smoothData[i];
      const y=cy+offset-
        audio*amp*scale+
        Math.sin(i*.085+phase)*9+
        Math.sin(i*.035-phase*.7)*6;

      if(i===0)ctx.moveTo(x,y);
      else{
        const px=cx-spread/2+(i-1)/(BAR_COUNT-1)*spread;
        const prev=cy+offset-
          smoothData[i-1]*amp*scale+
          Math.sin((i-1)*.085+phase)*9+
          Math.sin((i-1)*.035-phase*.7)*6;
        ctx.quadraticCurveTo(px,prev,(px+x)/2,(prev+y)/2);
      }
    }
    const hue=225+layer*9;
    ctx.strokeStyle=`hsla(${hue},100%,${75-layer*4}%,${.8-layer*.12})`;
    ctx.lineWidth=3-layer*.35;
    ctx.shadowColor=`hsla(${hue},100%,70%,.9)`;
    ctx.shadowBlur=18+layer*3;
    ctx.stroke();

    /* 波の下に広がる光 */
    ctx.lineTo(cx+spread/2,cy+height*.2);
    ctx.lineTo(cx-spread/2,cy+height*.2);
    ctx.closePath();
    const fill=ctx.createLinearGradient(0,cy-amp,0,cy+height*.2);
    fill.addColorStop(0,`rgba(100,140,255,${.08-layer*.01})`);
    fill.addColorStop(1,"rgba(40,70,180,0)");
    ctx.fillStyle=fill;
    ctx.fill();
  }

  /* 中央から流れる光 */
  const sweep=(animationTime*2.4)% (width+200)-100;
  const sweepGrad=ctx.createLinearGradient(sweep-70,0,sweep+70,0);
  sweepGrad.addColorStop(0,"rgba(100,140,255,0)");
  sweepGrad.addColorStop(.5,"rgba(170,205,255,.18)");
  sweepGrad.addColorStop(1,"rgba(100,140,255,0)");
  ctx.fillStyle=sweepGrad;
  ctx.fillRect(0,0,width,height);
  drawShockwaves();
}

/* Hyper Radial */
function drawRadial(){
  const cx=width/2,cy=height/2;
  const unit=Math.min(width,height);
  const base=unit*.19;
  const maxLen=unit*.24;

  ctx.save();

  /* 外側の回転リング */
  for(let r=0;r<4;r++){
    const radius=base*(1.35+r*.23);
    ctx.beginPath();
    ctx.arc(cx,cy,radius,animationTime*.002*(r%2?1:-1),animationTime*.002*(r%2?1:-1)+Math.PI*2);
    ctx.strokeStyle=`rgba(110,150,255,${.16-r*.025})`;
    ctx.lineWidth=1;
    ctx.setLineDash(r%2?[3,8]:[8,12]);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  /* スペクトラム */
  for(let i=0;i<BAR_COUNT;i++){
    const angle=i/BAR_COUNT*Math.PI*2-Math.PI/2;
    const level=smoothData[i];
    const len=level*maxLen;
    const hue=getHue(i);
    const r1=base;
    const r2=base+len;

    const x1=cx+Math.cos(angle)*r1;
    const y1=cy+Math.sin(angle)*r1;
    const x2=cx+Math.cos(angle)*r2;
    const y2=cy+Math.sin(angle)*r2;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle=`hsla(${hue},100%,${70+level*20}%,${.5+level*.5})`;
    ctx.lineWidth=2+level*3;
    ctx.lineCap="round";
    ctx.shadowColor=`hsla(${hue},100%,70%,.95)`;
    ctx.shadowBlur=10+level*28;
    ctx.stroke();

    if(level>.18){
      ctx.beginPath();
      ctx.arc(x2,y2,1.5+level*3,0,Math.PI*2);
      ctx.fillStyle="#dceaff";
      ctx.fill();
    }

    /* 内側の細い反応リング */
    const inner=base*.75+level*base*.35;
    ctx.beginPath();
    ctx.arc(cx,cy,inner,angle,angle+.025);
    ctx.strokeStyle=`hsla(${hue},100%,80%,.5)`;
    ctx.lineWidth=2;
    ctx.stroke();
  }

  /* 中央コア */
  const coreRadius=base*.78+lowEnergy*base*.4;
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,coreRadius);
  core.addColorStop(0,`rgba(190,210,255,${.12+lowEnergy*.3})`);
  core.addColorStop(.35,"rgba(100,140,255,.2)");
  core.addColorStop(1,"rgba(65,90,210,0)");
  ctx.fillStyle=core;
  ctx.beginPath();
  ctx.arc(cx,cy,coreRadius,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
  drawShockwaves();
}

/* Particle Storm */
function spawnParticles(){
  const cx=width/2,cy=height*.53;
  const average=smoothData.reduce((a,b)=>a+b,0)/BAR_COUNT;
  if(!isRunning)return;

  const amount=Math.floor(1+average*12+lowEnergy*8);
  for(let n=0;n<amount;n++){
    const index=Math.floor(Math.random()*BAR_COUNT);
    const angle=Math.random()*Math.PI*2;
    const speed=.7+Math.random()*1.6+smoothData[index]*4;
    particles.push({
      x:cx+Math.cos(angle)*10,
      y:cy+Math.sin(angle)*10,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      size:1+Math.random()*3,
      hue:getHue(index),
      trail:[]
    });
  }
}

function drawParticles(){
  const cx=width/2,cy=height*.53;
  const average=smoothData.reduce((a,b)=>a+b,0)/BAR_COUNT;

  if(average>.025&&Math.random()<.9)spawnParticles();

  ctx.save();
  ctx.globalCompositeOperation="lighter";

  /* 中央のエネルギー球 */
  const coreR=18+average*Math.min(width,height)*.28+lowEnergy*25;
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  core.addColorStop(0,`rgba(210,225,255,${.14+average*.5})`);
  core.addColorStop(.3,`rgba(110,150,255,${.15+average*.35})`);
  core.addColorStop(1,"rgba(60,90,255,0)");
  ctx.fillStyle=core;
  ctx.fillRect(0,0,width,height);

  particles.forEach(p=>{
    p.trail.unshift({x:p.x,y:p.y});
    if(p.trail.length>5)p.trail.pop();

    p.x+=p.vx;
    p.y+=p.vy;
    p.vx*=1.003;
    p.vy*=1.003;
    p.life-=.006;

    for(let i=0;i<p.trail.length;i++){
      const t=p.trail[i];
      ctx.beginPath();
      ctx.arc(t.x,t.y,p.size*(1-i/p.trail.length)*p.life,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},100%,80%,${p.life*(1-i/p.trail.length)*.55})`;
      ctx.shadowColor=`hsla(${p.hue},100%,70%,.9)`;
      ctx.shadowBlur=15;
      ctx.fill();
    }
  });

  particles=particles.filter(p=>
    p.life>0&&p.x>-100&&p.x<width+100&&p.y>-100&&p.y<height+100
  );
  if(particles.length>450)particles.splice(0,particles.length-450);

  ctx.restore();
  drawShockwaves();
}

/* 低音連動フラッシュ */
function drawFlash(){
  if(flash<=.005)return;
  ctx.fillStyle=`rgba(130,160,255,${flash*.075})`;
  ctx.fillRect(0,0,width,height);
  flash*=.86;
}

/* データ更新 */
function updateSpectrumData(){
  for(let i=0;i<BAR_COUNT;i++){
    let value=0;
    if(isRunning&&analyser&&frequencyData){
      value=getBarValue(i)/255*sensitivity;
      value=Math.min(1,value);
    }
    smoothData[i]=smoothData[i]*smoothing+value*(1-smoothing);
    peakData[i]=Math.max(smoothData[i],peakData[i]-.0025);
  }
}

/* 描画ループ */
function draw(){
  requestAnimationFrame(draw);
  if(!width||!height)return;

  animationTime++;

  if(isRunning&&analyser&&frequencyData){
    analyser.getByteFrequencyData(frequencyData);
    lowEnergy=getLowFrequency();

    globalGlow+=(Math.min(1,lowEnergy*2.8)-globalGlow)*.13;

    /* 低音の立ち上がりを検出 */
    const rising=lowEnergy-previousLow;
    if(rising>.035&&performance.now()-lastBeat>180){
      flash=Math.min(1,flash+.65);
      addShockwave();
      lastBeat=performance.now();
    }
    previousLow=lowEnergy;
  }else{
    globalGlow*=.96;
    lowEnergy*=.94;
    previousLow*=.94;
  }

  updateSpectrumData();
  drawBackground();

  switch(currentEffect){
    case "spectrum": drawSpectrum(); break;
    case "mirror": drawMirror(); break;
    case "wave": drawWave(); break;
    case "radial": drawRadial(); break;
    case "particles": drawParticles(); break;
  }

  drawFlash();
}
draw();

/* 設定 */
$("settingsBtn").addEventListener("click",e=>{
  e.stopPropagation();
  settings.classList.toggle("open");
  if(settings.classList.contains("open"))showControls();
  else scheduleHide();
});

/* 全画面 */
$("fullscreenBtn").addEventListener("click",e=>{
  e.stopPropagation();
  app.classList.toggle("fullscreen");
  if(app.classList.contains("fullscreen")){
    settings.classList.remove("open");
    showControls();
  }else{
    clearTimeout(hideTimer);
    app.classList.remove("controlsHidden");
  }
});

function showControls(){
  app.classList.remove("controlsHidden");
  clearTimeout(hideTimer);
  if(app.classList.contains("fullscreen")&&!settings.classList.contains("open")){
    scheduleHide();
  }
}
function scheduleHide(){
  clearTimeout(hideTimer);
  if(app.classList.contains("fullscreen")&&!settings.classList.contains("open")){
    hideTimer=setTimeout(()=>app.classList.add("controlsHidden"),3500);
  }
}

app.addEventListener("pointerdown",e=>{
  if(!app.classList.contains("fullscreen"))return;
  if(settings.contains(e.target)){showControls();return}
  if(e.target.closest(".toolbar")){showControls();return}
  if(app.classList.contains("controlsHidden"))showControls();
  else scheduleHide();
});

document.addEventListener("visibilitychange",async()=>{
  if(!document.hidden&&audioContext&&audioContext.state==="suspended"){
    try{await audioContext.resume()}catch(e){}
  }
});

window.addEventListener("orientationchange",()=>setTimeout(resizeCanvas,200));

})();
</script>
