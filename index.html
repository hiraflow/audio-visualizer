
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spectrum Visualizer</title>

<style>
:root {
  --bg: #050711;
  --panel: rgba(15, 19, 36, .92);
  --line: rgba(150, 170, 255, .16);
  --text: #e9edff;
  --sub: #8792b5;
  --accent: #8c9cff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

body {
  min-height: 100dvh;
}

button, input {
  font: inherit;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(40, 55, 115, .17), transparent 65%),
    #050711;
}

#visualArea {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: manipulation;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* 上部タイトル */
.header {
  position: absolute;
  top: max(18px, env(safe-area-inset-top));
  left: 22px;
  z-index: 5;
  pointer-events: none;
  transition: opacity .35s, transform .35s;
}

.header h1 {
  font-size: 13px;
  letter-spacing: 4px;
  font-weight: 600;
  margin: 0;
  color: rgba(225, 232, 255, .8);
}

.header p {
  font-size: 9px;
  letter-spacing: 2px;
  margin: 5px 0 0;
  color: #687397;
}

/* 下部情報 */
.status {
  position: absolute;
  left: 22px;
  bottom: max(22px, env(safe-area-inset-bottom));
  z-index: 5;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #7683aa;
  pointer-events: none;
  transition: opacity .35s;
}

.status span {
  color: #aab7ff;
}

/* 操作ツールバー */
.toolbar {
  position: absolute;
  z-index: 30;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  transition: opacity .35s, transform .35s;
}

.btn {
  border: 1px solid rgba(160, 175, 255, .2);
  background: rgba(18, 24, 48, .82);
  color: #e7ebff;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 12px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  cursor: pointer;
}

.btn.primary {
  background: rgba(103, 119, 226, .28);
  border-color: rgba(145, 160, 255, .4);
}

.btn:active {
  transform: scale(.96);
}

.iconBtn {
  width: 42px;
  height: 42px;
  padding: 0;
  font-size: 17px;
  display: grid;
  place-items: center;
}

/* 設定パネル */
.settings {
  position: absolute;
  z-index: 25;
  top: max(70px, calc(env(safe-area-inset-top) + 62px));
  right: 16px;
  width: min(310px, calc(100vw - 32px));
  max-height: calc(100dvh - 100px);
  overflow-y: auto;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 18px 60px rgba(0,0,0,.4);
  display: none;
}

.settings.open {
  display: block;
}

.settings h2 {
  font-size: 13px;
  letter-spacing: 2px;
  margin: 0 0 20px;
}

.setting {
  margin: 18px 0;
}

.settingHead {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #b7c1e5;
  margin-bottom: 10px;
}

.settingHead output {
  color: #9eacff;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: #929fff;
  height: 4px;
}

.meterGroup {
  margin-top: 23px;
}

.meterTitle {
  font-size: 10px;
  color: #9ba8d2;
  letter-spacing: 1.5px;
  margin-bottom: 13px;
}

.meter {
  margin: 11px 0;
}

.meterLabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8e9abe;
  margin-bottom: 6px;
}

.meterTrack {
  height: 5px;
  border-radius: 8px;
  background: rgba(140, 155, 220, .12);
  overflow: hidden;
}

.meterFill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6379df, #9caaff, #d2d8ff);
  transition: width .08s linear;
}

/* 全画面 */
#app.fullscreen .header,
#app.fullscreen .status {
  opacity: 0;
}

#app.fullscreen .toolbar {
  opacity: 1;
}

#app.fullscreen.controlsHidden .toolbar {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
}

#app.fullscreen.controlsHidden .header,
#app.fullscreen.controlsHidden .status {
  opacity: 0;
}

#app.fullscreen .settings.open {
  display: block;
}

/* 接続案内 */
.centerMessage {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 4;
  transition: opacity .4s;
}

.centerMessage strong {
  display: block;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 500;
  color: rgba(190, 202, 255, .7);
}

.centerMessage small {
  display: block;
  margin-top: 8px;
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(130, 145, 190, .55);
}

.centerMessage.hidden {
  opacity: 0;
}

@media (max-width: 600px) {
  .header {
    left: 15px;
  }

  .toolbar {
    right: 12px;
  }

  .status {
    left: 15px;
  }

  .btn {
    padding: 10px 11px;
  }

  .iconBtn {
    width: 40px;
    height: 40px;
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="visualArea">
    <canvas id="canvas"></canvas>
  </div>

  <div class="header">
    <h1>SPECTRUM</h1>
    <p>AUDIO VISUALIZER</p>
  </div>

  <div class="status" id="status">
    INPUT : <span id="statusText">WAITING</span>
  </div>

  <div class="centerMessage" id="centerMessage">
    <strong>READY TO VISUALIZE</strong>
    <small>START MICROPHONE TO BEGIN</small>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="btn primary" id="micBtn">マイク開始</button>
    <button class="btn iconBtn" id="settingsBtn" aria-label="設定">⚙</button>
    <button class="btn iconBtn" id="fullscreenBtn" aria-label="全画面">⛶</button>
  </div>

  <div class="settings" id="settings">
    <h2>VISUALIZER SETTINGS</h2>

    <div class="setting">
      <div class="settingHead">
        <label for="gain">入力レベル</label>
        <output id="gainValue">1.0x</output>
      </div>
      <input id="gain" type="range" min="0.5" max="8" step="0.1" value="1">
    </div>

    <div class="setting">
      <div class="settingHead">
        <label for="sensitivity">感度</label>
        <output id="sensitivityValue">1.8x</output>
      </div>
      <input id="sensitivity" type="range" min="0.5" max="5" step="0.1" value="1.8">
    </div>

    <div class="setting">
      <div class="settingHead">
        <label for="smooth">滑らかさ</label>
        <output id="smoothValue">0.72</output>
      </div>
      <input id="smooth" type="range" min="0" max="0.95" step="0.01" value="0.72">
    </div>

    <div class="meterGroup">
      <div class="meterTitle">INPUT LEVEL</div>
      <div class="meterTrack">
        <div class="meterFill" id="inputMeter"></div>
      </div>
    </div>

    <div class="meterGroup">
      <div class="meterTitle">FREQUENCY ANALYSIS</div>

      <div class="meter">
        <div class="meterLabel">
          <span>LOW · 35–250 Hz</span>
          <span id="lowValue">0%</span>
        </div>
        <div class="meterTrack">
          <div class="meterFill" id="lowMeter"></div>
        </div>
      </div>

      <div class="meter">
        <div class="meterLabel">
          <span>MID · 250–3500 Hz</span>
          <span id="midValue">0%</span>
        </div>
        <div class="meterTrack">
          <div class="meterFill" id="midMeter"></div>
        </div>
      </div>

      <div class="meter">
        <div class="meterLabel">
          <span>HIGH · 3500–12000 Hz</span>
          <span id="highValue">0%</span>
        </div>
        <div class="meterTrack">
          <div class="meterFill" id="highMeter"></div>
        </div>
      </div>
    </div>

    <button class="btn" id="reconnectBtn" style="width:100%; margin-top:18px;">
      マイクを再取得
    </button>
  </div>

</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const app = $("app");
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const micBtn = $("micBtn");
const settingsBtn = $("settingsBtn");
const fullscreenBtn = $("fullscreenBtn");
const settings = $("settings");

let audioContext = null;
let source = null;
let gainNode = null;
let analyser = null;
let stream = null;

let frequencyData = null;
let smoothData = [];
let peakData = [];

let width = 0;
let height = 0;
let dpr = 1;
let animationId = 0;
let isRunning = false;

let gainValue = 1;
let sensitivity = 1.8;
let smoothing = 0.72;

let hideTimer = null;
let lastTouch = 0;

const BAR_COUNT = 100;

/* サイズ調整 */
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  width = rect.width;
  height = rect.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  smoothData = [];
  peakData = [];
}

if ("ResizeObserver" in window) {
  new ResizeObserver(resizeCanvas).observe($("visualArea"));
} else {
  window.addEventListener("resize", resizeCanvas);
}

resizeCanvas();

/* マイク取得 */
async function startMicrophone() {
  try {
    micBtn.textContent = "接続中...";

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("この環境ではマイクを利用できません。HTTPS接続を確認してください。");
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    if (audioContext) {
      try {
        await audioContext.close();
      } catch (e) {}
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContextClass();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    source = audioContext.createMediaStreamSource(stream);

    gainNode = audioContext.createGain();
    gainNode.gain.value = gainValue;

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -20;
    analyser.smoothingTimeConstant = 0;

    source.connect(gainNode);
    gainNode.connect(analyser);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);

    smoothData = new Array(BAR_COUNT).fill(0);
    peakData = new Array(BAR_COUNT).fill(0);

    isRunning = true;

    $("statusText").textContent = "CONNECTED";
    $("centerMessage").classList.add("hidden");

    micBtn.textContent = "マイク接続済み";
    micBtn.classList.add("primary");

  } catch (error) {
    console.error(error);
    $("statusText").textContent = "ERROR";
    micBtn.textContent = "マイク開始";
    alert("マイクを取得できませんでした。\n\n" + error.message);
  }
}

micBtn.addEventListener("click", async () => {
  await startMicrophone();
});

$("reconnectBtn").addEventListener("click", async () => {
  await startMicrophone();
});

/* スライダー */
$("gain").addEventListener("input", e => {
  gainValue = Number(e.target.value);
  $("gainValue").textContent = gainValue.toFixed(1) + "x";

  if (gainNode) {
    gainNode.gain.setTargetAtTime(
      gainValue,
      audioContext.currentTime,
      0.04
    );
  }
});

$("sensitivity").addEventListener("input", e => {
  sensitivity = Number(e.target.value);
  $("sensitivityValue").textContent = sensitivity.toFixed(1) + "x";
});

$("smooth").addEventListener("input", e => {
  smoothing = Number(e.target.value);
  $("smoothValue").textContent = smoothing.toFixed(2);
});

/* 設定 */
settingsBtn.addEventListener("click", e => {
  e.stopPropagation();
  settings.classList.toggle("open");

  if (settings.classList.contains("open")) {
    showControls();
  } else {
    scheduleHide();
  }
});

/* 全画面モード */
fullscreenBtn.addEventListener("click", e => {
  e.stopPropagation();

  app.classList.toggle("fullscreen");

  if (app.classList.contains("fullscreen")) {
    settings.classList.remove("open");
    showControls();
  } else {
    clearTimeout(hideTimer);
    app.classList.remove("controlsHidden");
  }
});

/* 操作メニューの自動表示・非表示 */
function showControls() {
  app.classList.remove("controlsHidden");
  clearTimeout(hideTimer);

  if (
    app.classList.contains("fullscreen") &&
    !settings.classList.contains("open")
  ) {
    scheduleHide();
  }
}

function scheduleHide() {
  clearTimeout(hideTimer);

  if (
    app.classList.contains("fullscreen") &&
    !settings.classList.contains("open")
  ) {
    hideTimer = setTimeout(() => {
      app.classList.add("controlsHidden");
    }, 3500);
  }
}

/* 全画面時は画面タップで操作を表示 */
app.addEventListener("pointerdown", e => {
  if (!app.classList.contains("fullscreen")) return;

  lastTouch = Date.now();

  if (settings.contains(e.target)) {
    showControls();
    return;
  }

  if (e.target.closest(".toolbar")) {
    showControls();
    return;
  }

  if (app.classList.contains("controlsHidden")) {
    showControls();
  } else {
    scheduleHide();
  }
});

/* 周波数の取得 */
function getFrequencyAt(hz) {
  if (!analyser || !frequencyData || !audioContext) return 0;

  const index = Math.round(
    hz * analyser.fftSize / audioContext.sampleRate
  );

  return frequencyData[
    Math.max(0, Math.min(frequencyData.length - 1, index))
  ] || 0;
}

function averageFrequency(startHz, endHz) {
  if (!audioContext || !frequencyData) return 0;

  const start = Math.max(
    0,
    Math.floor(startHz * analyser.fftSize / audioContext.sampleRate)
  );

  const end = Math.min(
    frequencyData.length - 1,
    Math.ceil(endHz * analyser.fftSize / audioContext.sampleRate)
  );

  let total = 0;
  let count = 0;

  for (let i = start; i <= end; i++) {
    total += frequencyData[i];
    count++;
  }

  return count ? total / count : 0;
}

/* バーの周波数分布 */
function getBarValue(index) {
  const minHz = 35;
  const maxHz = 15000;

  const t1 = index / BAR_COUNT;
  const t2 = (index + 1) / BAR_COUNT;

  const startHz = minHz * Math.pow(maxHz / minHz, t1);
  const endHz = minHz * Math.pow(maxHz / minHz, t2);

  const start = Math.max(
    0,
    Math.floor(startHz * analyser.fftSize / audioContext.sampleRate)
  );

  const end = Math.min(
    frequencyData.length - 1,
    Math.ceil(endHz * analyser.fftSize / audioContext.sampleRate)
  );

  let sum = 0;
  let count = 0;

  for (let i = start; i <= end; i++) {
    sum += frequencyData[i];
    count++;
  }

  return count ? sum / count : 0;
}

/* 背景 */
function drawBackground(time) {
  const bg = ctx.createRadialGradient(
    width * .5, height * .47, 0,
    width * .5, height * .47, Math.max(width, height) * .75
  );

  bg.addColorStop(0, "#111a38");
  bg.addColorStop(.5, "#080d20");
  bg.addColorStop(1, "#040610");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  const glow = ctx.createRadialGradient(
    width * .5, height * .52, 0,
    width * .5, height * .52, width * .48
  );

  glow.addColorStop(0, "rgba(70,95,200,.12)");
  glow.addColorStop(1, "rgba(40,60,130,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  drawFloor(time);
}

/* 湾曲した床のグリッド */
function drawFloor(time) {
  const centerX = width / 2;
  const baseY = height * .70;
  const floorHeight = height * .23;

  ctx.save();

  for (let i = 0; i < 9; i++) {
    const depth = i / 8;
    const y = baseY + depth * floorHeight;

    ctx.beginPath();
    ctx.moveTo(0, y + 30);
    ctx.quadraticCurveTo(
      centerX, y - 35 - depth * 12,
      width, y + 30
    );

    ctx.strokeStyle = `rgba(100,130,220,${.045 + depth * .025})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (let i = -10; i <= 10; i++) {
    const x = centerX + i * width * .065;

    ctx.beginPath();
    ctx.moveTo(centerX + (x - centerX) * .12, baseY - 15);
    ctx.quadraticCurveTo(
      x,
      baseY + floorHeight * .5,
      centerX + (x - centerX) * 1.8,
      baseY + floorHeight
    );

    ctx.strokeStyle = "rgba(100,130,220,.045)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();
}

/* Spectrum */
function drawSpectrum(time) {
  const centerX = width / 2;

  const compact = Math.min(width, height);
  const maxBarHeight = Math.min(height * .49, compact * .70);

  // 以前より横幅を広く使う
  const spread = width * .91;
  const barWidth = Math.max(2, spread / BAR_COUNT * .70);

  const baseY = height * .69;

  const idle = !isRunning;

  for (let i = 0; i < BAR_COUNT; i++) {
    let value = 0;

    if (!idle && analyser) {
      value = getBarValue(i) / 255;
      value *= sensitivity;

      value = Math.min(1, value);
    } else {
      value = .025 + Math.sin(time * .0015 + i * .13) * .012;
    }

    const eased = smoothing;

    smoothData[i] =
      (smoothData[i] || 0) * eased +
      value * (1 - eased);

    const level = smoothData[i];

    peakData[i] = Math.max(
      level,
      (peakData[i] || 0) - .0025
    );

    const normalizedX = (i / (BAR_COUNT - 1)) * 2 - 1;
    const distance = Math.abs(normalizedX);

    // 中央が手前、両端が奥へ向かう湾曲
    const curve = 1 - Math.pow(distance, 1.65) * .19;

    const x = centerX + normalizedX * spread * .5;
    const y = baseY + Math.pow(distance, 2) * height * .035;

    const barHeight = Math.max(
      2,
      level * maxBarHeight * curve
    );

    const peakHeight = peakData[i] * maxBarHeight * curve;

    const hue = 226 + (1 - distance) * 36;
    const alpha = .72 + (1 - distance) * .25;

    const gradient = ctx.createLinearGradient(
      x, y - barHeight,
      x, y
    );

    gradient.addColorStop(0, `hsla(${hue + 18}, 100%, 88%, ${alpha})`);
    gradient.addColorStop(.3, `hsla(${hue}, 95%, 72%, ${alpha})`);
    gradient.addColorStop(1, `hsla(${hue - 5}, 85%, 43%, .75)`);

    // 発光
    ctx.save();
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, .65)`;
    ctx.shadowBlur = 9 + level * 17;

    ctx.fillStyle = gradient;
    ctx.fillRect(
      x - barWidth / 2,
      y - barHeight,
      barWidth,
      barHeight
    );

    ctx.restore();

    // ピークライン
    if (peakHeight > 3) {
      ctx.fillStyle = `hsla(${hue + 20}, 100%, 88%, .8)`;
      ctx.fillRect(
        x - barWidth / 2,
        y - peakHeight - 2,
        barWidth,
        2
      );
    }

    // 床への反射
    if (level > .06) {
      const reflection = ctx.createLinearGradient(
        x, y,
        x, y + height * .13
      );

      reflection.addColorStop(0, `hsla(${hue}, 90%, 70%, .12)`);
      reflection.addColorStop(1, `hsla(${hue}, 90%, 60%, 0)`);

      ctx.fillStyle = reflection;
      ctx.fillRect(
        x - barWidth / 2,
        y + 1,
        barWidth,
        height * .13
      );
    }
  }

  // 中央の水平ライン
  ctx.save();

  const lineGradient = ctx.createLinearGradient(
    0, 0, width, 0
  );

  lineGradient.addColorStop(0, "rgba(100,130,255,0)");
  lineGradient.addColorStop(.5, "rgba(150,175,255,.45)");
  lineGradient.addColorStop(1, "rgba(100,130,255,0)");

  ctx.strokeStyle = lineGradient;
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.quadraticCurveTo(centerX, baseY - 22, width, baseY);
  ctx.stroke();

  ctx.restore();
}

/* メーター */
function updateMeters() {
  if (!isRunning || !analyser) return;

  analyser.getByteFrequencyData(frequencyData);

  const low = averageFrequency(35, 250);
  const mid = averageFrequency(250, 3500);
  const high = averageFrequency(3500, 12000);

  const input = Math.max(low, mid, high);

  const setMeter = (id, valueId, value) => {
    const percent = Math.min(100, value / 255 * 100);
    $(id).style.width = percent + "%";
    $(valueId).textContent = Math.round(percent) + "%";
  };

  setMeter("inputMeter", "inputMeter", input);
  setMeter("lowMeter", "lowValue", low);
  setMeter("midMeter", "midValue", mid);
  setMeter("highMeter", "highValue", high);
}

/* 描画ループ */
function draw(time) {
  animationId = requestAnimationFrame(draw);

  if (!width || !height) return;

  if (isRunning && analyser) {
    analyser.getByteFrequencyData(frequencyData);
    updateMeters();
  }

  drawBackground(time);
  drawSpectrum(time);
}

cancelAnimationFrame(animationId);
draw(0);

/* 画面の向き・復帰 */
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && audioContext && audioContext.state === "suspended") {
    try {
      await audioContext.resume();
    } catch (e) {}
  }
});

window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 200);
});

})();
</script>
</body>
