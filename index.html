
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>Audio Visualizer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #080b16;
  --panel: #11182a;
  --line: #263550;
  --text: #edf3ff;
  --muted: #8291ad;
  --accent: #75a5ff;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  padding: 16px;
  overflow-x: hidden;
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 1000px;
  margin: auto;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.brand {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 1px;
}

.brand small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 2px;
}

.visual-card {
  position: relative;
  overflow: hidden;
  border: 1px solid #263653;
  border-radius: 19px;
  background: #080c19;
  box-shadow: 0 15px 45px #0008;
}

.visual-area {
  position: relative;
  height: 430px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.visual-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(8,11,22,.24),
    transparent 25%,
    transparent 78%,
    rgba(8,11,22,.3)
  );
}

.visual-label {
  position: absolute;
  left: 17px;
  top: 16px;
  color: #8ea4cb;
  font-size: 10px;
  letter-spacing: 2px;
  pointer-events: none;
}

.visual-status {
  position: absolute;
  right: 17px;
  top: 16px;
  color: #8999b8;
  font-size: 10px;
  pointer-events: none;
}

.dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: #66738c;
  vertical-align: middle;
}

.dot.active {
  background: #4de2b0;
  box-shadow: 0 0 9px #4de2b0;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 13px 0;
}

.action {
  flex: 1;
  min-width: 0;
  padding: 13px 9px;
  border: 1px solid #344665;
  border-radius: 11px;
  color: #e7efff;
  background: #151f34;
  font-size: 12px;
  font-weight: 600;
}

.action.primary {
  border: none;
  background: linear-gradient(120deg, #376ff0, #8058db);
  color: white;
}

.action:disabled {
  opacity: .5;
}

.settings-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 105px;
  padding: 13px 14px;
  border: 1px solid #344665;
  border-radius: 11px;
  background: #151f34;
  color: #e7efff;
  font-size: 12px;
}

.settings-button.active {
  border-color: #7199e8;
  background: #1b2a47;
}

.settings-panel {
  display: none;
  padding: 17px;
  margin-top: 10px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--panel);
}

.settings-panel.open {
  display: block;
}

.settings-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 650;
}

.settings-title span:last-child {
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
}

.setting {
  margin-bottom: 21px;
}

.setting:last-child {
  margin-bottom: 0;
}

.setting-head,
.meter-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  color: #c4d0e7;
  font-size: 12px;
}

.value {
  color: #83aaff;
  font-weight: 650;
}

input[type="range"] {
  width: 100%;
  accent-color: #719bff;
}

.meter-bg {
  width: 100%;
  height: 7px;
  overflow: hidden;
  border-radius: 20px;
  background: #28354b;
}

.meter-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #3c79ff, #42e0c0);
  box-shadow: 0 0 12px #398bff80;
  transition: width .07s linear;
}

.frequency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

.frequency-item {
  min-width: 0;
}

.frequency-item small {
  display: block;
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
}

.frequency-item:nth-child(2) .meter-fill {
  background: linear-gradient(90deg, #26c6dc, #679bff);
}

.frequency-item:nth-child(3) .meter-fill {
  background: linear-gradient(90deg, #9b68ff, #ed79d0);
}

.footer {
  padding: 12px 3px;
  color: #697895;
  font-size: 10px;
  text-align: center;
}

/* 全画面 */

body.fullscreen {
  padding: 0;
  overflow: hidden;
}

body.fullscreen .app {
  width: 100%;
  max-width: none;
  height: 100dvh;
}

body.fullscreen header {
  display: none;
}

body.fullscreen .visual-card {
  position: fixed;
  inset: 0;
  z-index: 10;
  border: 0;
  border-radius: 0;
}

body.fullscreen .visual-area {
  width: 100%;
  height: 100%;
}

body.fullscreen .toolbar {
  position: fixed;
  z-index: 30;
  top: calc(55px + env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  margin: 0;
  pointer-events: none;
}

body.fullscreen .toolbar button {
  pointer-events: auto;
  flex: 0 0 auto;
  box-shadow: 0 5px 20px #0008;
  backdrop-filter: blur(15px);
}

body.fullscreen #startBtn,
body.fullscreen #reconnectBtn {
  display: none;
}

body.fullscreen .settings-panel {
  position: fixed;
  z-index: 25;
  top: calc(105px + env(safe-area-inset-top));
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(380px, calc(100vw - 24px));
  overflow-y: auto;
  background: #101a2bee;
  backdrop-filter: blur(20px);
  box-shadow: 0 12px 35px #0008;
}

body.fullscreen .footer {
  display: none;
}

@media(max-width: 600px) {
  body {
    padding: 10px;
  }

  .visual-area {
    height: 340px;
  }

  .frequency-grid {
    gap: 9px;
  }

  .settings-panel {
    padding: 14px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    AUDIO VISUALIZER
    <small>REALTIME SPECTRUM</small>
  </div>
</header>

<section class="visual-card">
  <div class="visual-area" id="visualArea">
    <canvas id="visualizer"></canvas>
    <div class="visual-overlay"></div>
    <div class="visual-label">SPECTRUM</div>
    <div class="visual-status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">STANDBY</span>
    </div>
  </div>
</section>

<div class="toolbar">
  <button class="action primary" id="startBtn">マイク開始</button>
  <button class="action" id="reconnectBtn">再取得</button>
  <button class="settings-button" id="settingsBtn">
    <span>⚙</span>
    <span id="settingsLabel">設定</span>
  </button>
  <button class="action" id="fullscreenBtn">全画面</button>
</div>

<section class="settings-panel" id="settingsPanel">

  <div class="settings-title">
    <span>VISUAL SETTINGS</span>
    <span>調整メニュー</span>
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>入力レベル</span>
      <span class="value" id="gainValue">50%</span>
    </div>
    <input type="range" id="gainSlider" min="0" max="100" value="50">
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>表示感度</span>
      <span class="value" id="sensitivityValue">70%</span>
    </div>
    <input type="range" id="sensitivitySlider" min="0" max="100" value="70">
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>滑らかさ</span>
      <span class="value" id="smoothValue">65%</span>
    </div>
    <input type="range" id="smoothSlider" min="0" max="95" value="65">
  </div>

  <div class="setting">
    <div class="meter-head">
      <span>マイク入力レベル</span>
      <span id="inputValue">0%</span>
    </div>
    <div class="meter-bg">
      <div class="meter-fill" id="inputMeter"></div>
    </div>
  </div>

  <div class="setting">
    <div class="meter-head">
      <span>周波数レベル</span>
    </div>

    <div class="frequency-grid">
      <div class="frequency-item">
        <div class="meter-head">
          <span>Low</span>
          <span id="lowValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="lowMeter"></div>
        </div>
        <small>35–250 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head">
          <span>Mid</span>
          <span id="midValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="midMeter"></div>
        </div>
        <small>250–3500 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head">
          <span>High</span>
          <span id="highValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="highMeter"></div>
        </div>
        <small>3500–12000 Hz</small>
      </div>
    </div>
  </div>

</section>

<div class="footer">
  AUDIO VISUALIZER · LIVE AUDIO ANALYSIS
</div>

</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $("visualizer");
const ctx = canvas.getContext("2d");

let audioContext = null;
let stream = null;
let source = null;
let gainNode = null;
let analyser = null;
let inputAnalyser = null;

let frequencyData = null;
let inputData = null;

let bars = [];
let peaks = [];
let particles = [];

let width = 0;
let height = 0;
let dpr = 1;

let currentBass = 0;
let bands = { low: 0, mid: 0, high: 0 };
let animationFrame = null;
let connecting = false;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  width = rect.width;
  height = rect.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.max(36, Math.floor(width / 6));

  bars = Array(count).fill(0);
  peaks = Array(count).fill(0);
}

new ResizeObserver(resizeCanvas).observe($("visualArea"));
window.addEventListener("resize", resizeCanvas);

function getGain(value) {
  return value <= 50
    ? value / 50 * 2
    : 2 + (value - 50) / 50;
}

function updateSettings() {
  $("gainValue").textContent = $("gainSlider").value + "%";
  $("sensitivityValue").textContent = $("sensitivitySlider").value + "%";
  $("smoothValue").textContent = $("smoothSlider").value + "%";

  if (gainNode && audioContext) {
    gainNode.gain.setTargetAtTime(
      getGain(Number($("gainSlider").value)),
      audioContext.currentTime,
      0.05
    );
  }
}

["gainSlider", "sensitivitySlider", "smoothSlider"].forEach(id => {
  $(id).addEventListener("input", updateSettings);
});

function setStatus(active, text) {
  $("statusText").textContent = text;
  $("statusDot").classList.toggle("active", active);
}

async function stopMicrophone() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  source = null;
  analyser = null;
  inputAnalyser = null;
  gainNode = null;
  frequencyData = null;
  inputData = null;

  if (audioContext) {
    try {
      await audioContext.close();
    } catch (e) {}
    audioContext = null;
  }
}

async function startMicrophone() {
  if (connecting) return;

  connecting = true;
  $("startBtn").disabled = true;
  $("reconnectBtn").disabled = true;

  setStatus(false, "CONNECTING");

  try {
    await stopMicrophone();

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Microphone API unavailable");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    source = audioContext.createMediaStreamSource(stream);

    inputAnalyser = audioContext.createAnalyser();
    inputAnalyser.fftSize = 2048;
    inputAnalyser.smoothingTimeConstant = 0.15;

    gainNode = audioContext.createGain();
    gainNode.gain.value = getGain(Number($("gainSlider").value));

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 8192;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -15;
    analyser.smoothingTimeConstant = 0.2;

    source.connect(inputAnalyser);
    source.connect(gainNode);
    gainNode.connect(analyser);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
    inputData = new Float32Array(inputAnalyser.fftSize);

    bands = { low: 0, mid: 0, high: 0 };
    particles = [];

    setStatus(true, "LIVE");
    $("startBtn").textContent = "接続済み";

  } catch (error) {
    console.error(error);
    await stopMicrophone();

    setStatus(false, "MIC ERROR");
    $("startBtn").textContent = "マイク開始";

    alert(
      "マイクを取得できませんでした。\nSafariのマイク許可とHTTPS接続を確認してください。"
    );

  } finally {
    connecting = false;
    $("startBtn").disabled = false;
    $("reconnectBtn").disabled = false;
  }
}

$("startBtn").addEventListener("click", () => {
  if (!stream) startMicrophone();
});

$("reconnectBtn").addEventListener("click", startMicrophone);

/* メニュー */

function toggleSettings() {
  const panel = $("settingsPanel");
  const open = panel.classList.toggle("open");

  $("settingsBtn").classList.toggle("active", open);
  $("settingsLabel").textContent = open ? "閉じる" : "設定";
}

$("settingsBtn").addEventListener("click", toggleSettings);

/* 全画面 */

$("fullscreenBtn").addEventListener("click", async () => {
  const entering = !document.body.classList.contains("fullscreen");

  document.body.classList.toggle("fullscreen", entering);

  $("fullscreenBtn").textContent = entering ? "縮小" : "全画面";

  requestAnimationFrame(resizeCanvas);
});

/* 周波数 */

function frequencyIndex(hz) {
  return Math.round(hz * analyser.fftSize / audioContext.sampleRate);
}

function bandLevel(minHz, maxHz) {
  const min = Math.max(0, frequencyIndex(minHz));
  const max = Math.min(frequencyData.length - 1, frequencyIndex(maxHz));

  let sum = 0;
  let count = 0;

  for (let i = min; i <= max; i++) {
    const v = frequencyData[i] / 255;
    sum += v * v;
    count++;
  }

  return count ? Math.sqrt(sum / count) : 0;
}

function updateMeters() {
  if (!analyser || !inputAnalyser) return;

  inputAnalyser.getFloatTimeDomainData(inputData);

  let sum = 0;
  for (let i = 0; i < inputData.length; i++) {
    sum += inputData[i] * inputData[i];
  }

  const rms = Math.sqrt(sum / inputData.length);
  const db = 20 * Math.log10(Math.max(rms, 0.000001));
  const input = Math.max(0, Math.min(100, (db + 60) * 2));

  $("inputMeter").style.width = input + "%";
  $("inputValue").textContent = Math.round(input) + "%";

  const low = bandLevel(35, 250);
  const mid = bandLevel(250, 3500);
  const high = bandLevel(3500, 12000);

  const s = Number($("smoothSlider").value) / 100 * 0.9;

  bands.low = bands.low * s + low * (1 - s);
  bands.mid = bands.mid * s + mid * (1 - s);
  bands.high = bands.high * s + high * (1 - s);

  const values = [
    ["low", bands.low],
    ["mid", bands.mid],
    ["high", bands.high]
  ];

  values.forEach(([name, value]) => {
    const p = Math.min(100, value * 180);
    $(name + "Meter").style.width = p + "%";
    $(name + "Value").textContent = Math.round(p) + "%";
  });

  currentBass = bands.low;
}

/* 湾曲した空間の背景 */

function drawBackground(time) {
  ctx.fillStyle = "#080c19";
  ctx.fillRect(0, 0, width, height);

  const bass = Math.min(1, currentBass * 5);

  const bg = ctx.createRadialGradient(
    width / 2,
    height * 0.75,
    0,
    width / 2,
    height * 0.75,
    width * 0.8
  );

  bg.addColorStop(0, `rgba(40,90,220,${0.07 + bass * 0.15})`);
  bg.addColorStop(0.55, "rgba(25,50,120,0.07)");
  bg.addColorStop(1, "#080c19");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  const centerX = width / 2;
  const horizon = height * 0.52;

  // 湾曲した奥行きのライン
  for (let i = 0; i < 15; i++) {
    const t = i / 14;
    const y = horizon + t * t * height * 0.46;

    ctx.beginPath();
    ctx.moveTo(0, y + 22);
    ctx.quadraticCurveTo(
      centerX,
      y - 35 * (1 - t),
      width,
      y + 22
    );

    ctx.strokeStyle = `rgba(90,145,255,${0.025 + t * 0.025})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 放射状の湾曲ガイド
  for (let i = -9; i <= 9; i++) {
    const endX = centerX + i * width * 0.095;

    ctx.beginPath();
    ctx.moveTo(centerX, horizon - 15);
    ctx.quadraticCurveTo(
      centerX + i * width * 0.045,
      height * 0.7,
      endX,
      height
    );

    ctx.strokeStyle = "rgba(90,145,255,0.045)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 中央奥から広がる光
  const glow = ctx.createRadialGradient(
    centerX,
    horizon,
    0,
    centerX,
    horizon,
    width * 0.55
  );

  glow.addColorStop(0, `rgba(65,125,255,${0.04 + bass * 0.12})`);
  glow.addColorStop(1, "rgba(65,125,255,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);
}

/* 浮遊粒子 */

function drawParticles() {
  if (currentBass > 0.025 && Math.random() < 0.35) {
    particles.push({
      x: Math.random() * width,
      y: height * (0.5 + Math.random() * 0.45),
      size: 1 + Math.random() * 1.8,
      life: 1,
      speed: 0.4 + Math.random()
    });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.y -= p.speed;
    p.life -= 0.009;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(130,180,255,${p.life * 0.55})`;
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  }

  if (particles.length > 90) particles.splice(0, 10);
}

/* 湾曲したSpectrum */

function drawSpectrum(time) {
  if (!analyser || !frequencyData) {
    drawIdle(time);
    return;
  }

  analyser.getByteFrequencyData(frequencyData);
  updateMeters();

  const sensitivity = Number($("sensitivitySlider").value) / 100;
  const smooth = Number($("smoothSlider").value) / 100;

  const count = bars.length;
  const gap = Math.max(1.5, width / count * 0.22);
  const barWidth = width / count - gap;

  const centerX = width / 2;
  const centerY = height * 0.69;

  const maxHeight = height * 0.43;
  const curve = height * 0.19;

  drawBackground(time);
  drawParticles();

  const minHz = 35;
  const maxHz = 12000;

  for (let i = 0; i < count; i++) {
    const position = i / Math.max(1, count - 1);
    const normalized = position * 2 - 1;

    // 中央が手前、左右が奥へ回り込む湾曲
    const curveOffset = normalized * normalized * curve;

    const baseY = centerY + curveOffset;

    // 両端に向かうほど奥へ遠ざかる遠近感
    const perspective = 1 - Math.abs(normalized) * 0.20;
    const barW = barWidth * perspective;

    const hz = minHz * Math.pow(maxHz / minHz, position);

    const index = Math.min(
      frequencyData.length - 1,
      Math.max(
        0,
        Math.round(hz * analyser.fftSize / audioContext.sampleRate)
      )
    );

    let value = frequencyData[index] / 255;

    if (position < 0.25) value *= 1.3;
    else if (position > 0.75) value *= 1.15;

    if (index > 1 && index < frequencyData.length - 2) {
      const neighbor =
        (frequencyData[index - 1] + frequencyData[index + 1]) / 510;

      value = value * 0.8 + neighbor * 0.2;
    }

    value = Math.min(1, value * (0.35 + sensitivity * 2.4));

    bars[i] =
      bars[i] * smooth * 0.65 +
      value * (1 - smooth * 0.65);

    const barHeight = Math.max(1.5, bars[i] * maxHeight);

    peaks[i] = Math.max(
      bars[i],
      peaks[i] - 0.004 - (1 - smooth) * 0.006
    );

    const x = i * width / count + (barWidth - barW) / 2;
    const y = baseY - barHeight;

    const hue = 205 + position * 120;

    // 中央ほど明るく、端ほど奥まった印象
    const alpha = 0.6 + perspective * 0.4;

    const gradient = ctx.createLinearGradient(0, y, 0, baseY);
    gradient.addColorStop(0, `hsla(${hue},100%,76%,${alpha})`);
    gradient.addColorStop(0.45, `hsla(${hue + 10},100%,61%,${alpha})`);
    gradient.addColorStop(1, `hsla(${hue + 15},95%,45%,${alpha})`);

    // 棒は平面のまま
    ctx.fillStyle = gradient;
    ctx.shadowColor = `hsla(${hue},100%,65%,0.8)`;
    ctx.shadowBlur = 5 + bars[i] * 13;

    ctx.fillRect(x, y, barW, barHeight);

    ctx.shadowBlur = 0;

    // ピーク表示
    const peakY = baseY - peaks[i] * maxHeight;

    ctx.fillStyle = `hsla(${hue + 25},100%,87%,${alpha})`;
    ctx.fillRect(x, peakY - 1.5, barW, 1.5);

    // 床への反射
    const reflection = ctx.createLinearGradient(
      0, baseY, 0, baseY + barHeight * 0.2
    );

    reflection.addColorStop(0, `hsla(${hue},100%,65%,0.15)`);
    reflection.addColorStop(1, `hsla(${hue},100%,65%,0)`);

    ctx.fillStyle = reflection;
    ctx.fillRect(x, baseY + 2, barW, barHeight * 0.2);
  }

  // 湾曲したベースライン
  ctx.beginPath();

  for (let i = 0; i <= 80; i++) {
    const t = i / 80;
    const nx = t * 2 - 1;
    const x = t * width;
    const y = centerY + nx * nx * curve;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  const line = ctx.createLinearGradient(0, 0, width, 0);
  line.addColorStop(0, "rgba(65,125,255,0)");
  line.addColorStop(0.5, "rgba(130,190,255,0.85)");
  line.addColorStop(1, "rgba(65,125,255,0)");

  ctx.strokeStyle = line;
  ctx.lineWidth = 1.4;
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#559aff";
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 低音に反応する中央の光
  const bass = Math.min(1, currentBass * 6);

  const bassGlow = ctx.createRadialGradient(
    centerX,
    centerY,
    0,
    centerX,
    centerY,
    width * 0.5
  );

  bassGlow.addColorStop(0, `rgba(55,125,255,${bass * 0.16})`);
  bassGlow.addColorStop(1, "rgba(55,125,255,0)");

  ctx.fillStyle = bassGlow;
  ctx.fillRect(0, 0, width, height);
}

/* 待機画面 */

function drawIdle(time) {
  drawBackground(time);

  const cx = width / 2;
  const cy = height * 0.69;
  const pulse = 1 + Math.sin(time * 0.0018) * 0.07;

  ctx.beginPath();
  ctx.ellipse(cx, cy, 32 * pulse, 12 * pulse, 0, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(105,155,255,0.9)";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 22;
  ctx.shadowColor = "#578dff";
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = "center";
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#8298bf";
  ctx.fillText("MICROPHONE STANDBY", cx, cy + 40);
}

/* アニメーション */

function animate(time) {
  ctx.clearRect(0, 0, width, height);
  drawSpectrum(time);
  animationFrame = requestAnimationFrame(animate);
}

function startAnimation() {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(animate);
}

updateSettings();
resizeCanvas();
startAnimation();

</script>
