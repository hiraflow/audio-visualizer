
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050817">
<title>Spectrum Visualizer X</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #03050e;
  color: #eef2ff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  position: relative;
}

#visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

header {
  position: absolute;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 5;
  background: linear-gradient(to bottom, rgba(3,5,14,.75), transparent);
  transition: opacity .4s;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #dce5ff;
}

.controls {
  display: flex;
  gap: 9px;
}

.control-btn {
  width: 42px;
  height: 42px;
  border: 1px solid rgba(160,180,255,.18);
  border-radius: 14px;
  background: rgba(25,35,75,.58);
  color: #dce5ff;
  font-size: 18px;
  display: grid;
  place-items: center;
  backdrop-filter: blur(12px);
}

.control-btn:active {
  background: rgba(80,105,190,.55);
}

#settings {
  position: absolute;
  z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  right: 14px;
  width: min(290px, calc(100vw - 28px));
  padding: 19px;
  border: 1px solid rgba(150,170,255,.2);
  border-radius: 20px;
  background: rgba(9,14,34,.88);
  backdrop-filter: blur(22px);
  box-shadow: 0 15px 50px rgba(0,0,0,.35);
  display: none;
}

#settings.open {
  display: block;
}

.settings-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 18px;
  letter-spacing: 1px;
}

.setting {
  margin-bottom: 20px;
}

.setting:last-child {
  margin-bottom: 2px;
}

.setting-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  color: #aebbe5;
}

.setting-value {
  color: #e0e8ff;
  font-variant-numeric: tabular-nums;
}

select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid rgba(150,170,255,.2);
  border-radius: 10px;
  color: #eaf0ff;
  background: #111a38;
  outline: none;
  font-size: 13px;
}

input[type="range"] {
  width: 100%;
  accent-color: #829cff;
  height: 4px;
}

#status {
  position: absolute;
  z-index: 4;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(190,205,255,.55);
  letter-spacing: 1px;
  pointer-events: none;
  transition: opacity .4s;
}

.fullscreen header,
.fullscreen #status {
  opacity: 0;
  pointer-events: none;
}

.fullscreen.controls-visible header,
.fullscreen.controls-visible #status {
  opacity: 1;
  pointer-events: auto;
}

.fullscreen #settings {
  top: calc(env(safe-area-inset-top, 0px) + 65px);
}

@media (max-width: 500px) {
  header {
    padding: 0 14px;
  }
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<header id="header">
  <div class="logo">SPECTRUM X</div>
  <div class="controls">
    <button class="control-btn" id="micButton" aria-label="マイク">◉</button>
    <button class="control-btn" id="settingsButton" aria-label="設定">⚙</button>
    <button class="control-btn" id="fullscreenButton" aria-label="全画面">⛶</button>
  </div>
</header>

<div id="settings">
  <div class="settings-title">VISUAL SETTINGS</div>

  <div class="setting">
    <div class="setting-head">
      <span>エフェクト</span>
    </div>
    <select id="effectSelect">
      <option value="spectrum">Spectrum X</option>
      <option value="mirror">Mirror Pulse</option>
      <option value="wave">Wave Flow</option>
      <option value="radial">Hyper Radial</option>
      <option value="particles">Particle Storm</option>
    </select>
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>入力レベル</span>
      <span class="setting-value" id="gainValue">300%</span>
    </div>
    <input id="gainSlider" type="range" min="0" max="100" value="50">
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>感度</span>
      <span class="setting-value" id="sensitivityValue">150%</span>
    </div>
    <input id="sensitivitySlider" type="range" min="0" max="100" value="50">
  </div>
</div>

<div id="status">MICROPHONE NOT CONNECTED</div>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* 音声入力 */
let audioContext = null;
let analyser = null;
let microphone = null;
let gainNode = null;
let stream = null;
let frequencyData = null;
let isRunning = false;

let inputGain = 3;
let sensitivity = 1.5;

const statusText = document.getElementById("status");

async function startMicrophone() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("この環境ではマイクを利用できません");
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    if (audioContext) {
      await audioContext.close();
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    microphone = audioContext.createMediaStreamSource(stream);
    gainNode = audioContext.createGain();
    analyser = audioContext.createAnalyser();

    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.72;

    frequencyData = new Uint8Array(analyser.frequencyBinCount);

    gainNode.gain.value = inputGain;

    microphone.connect(gainNode);
    gainNode.connect(analyser);

    isRunning = true;
    statusText.textContent = "MICROPHONE CONNECTED";
    document.getElementById("micButton").textContent = "●";

  } catch (error) {
    console.error(error);
    statusText.textContent = "MICROPHONE CONNECTION FAILED";
    isRunning = false;
  }
}

document.getElementById("micButton").addEventListener("click", startMicrophone);

/* 設定 */
const gainSlider = document.getElementById("gainSlider");
const sensitivitySlider = document.getElementById("sensitivitySlider");

gainSlider.addEventListener("input", () => {
  inputGain = Number(gainSlider.value) / 50 * 3;

  document.getElementById("gainValue").textContent =
    Math.round(inputGain * 100) + "%";

  if (gainNode) {
    gainNode.gain.setTargetAtTime(
      inputGain,
      audioContext.currentTime,
      0.03
    );
  }
});

sensitivitySlider.addEventListener("input", () => {
  sensitivity = Number(sensitivitySlider.value) / 50 * 1.5;

  document.getElementById("sensitivityValue").textContent =
    Math.round(sensitivity * 100) + "%";
});

document.getElementById("settingsButton").addEventListener("click", () => {
  document.getElementById("settings").classList.toggle("open");
});

/* 全画面 */
const body = document.body;
const fullscreenButton = document.getElementById("fullscreenButton");

fullscreenButton.addEventListener("click", async () => {
  if (!document.fullscreenElement) {
    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {}
    body.classList.add("fullscreen");
    showControls();
  } else {
    await document.exitFullscreen();
    body.classList.remove("fullscreen");
  }
});

document.addEventListener("fullscreenchange", () => {
  body.classList.toggle("fullscreen", !!document.fullscreenElement);
});

let controlsTimer;

function showControls() {
  body.classList.add("controls-visible");
  clearTimeout(controlsTimer);

  controlsTimer = setTimeout(() => {
    if (document.fullscreenElement &&
        !document.getElementById("settings").classList.contains("open")) {
      body.classList.remove("controls-visible");
    }
  }, 3500);
}

canvas.addEventListener("pointerdown", () => {
  if (document.fullscreenElement) showControls();
});

/* 周波数解析 */
const BAR_COUNT = 100;
const bars = new Array(BAR_COUNT).fill(0);
const peaks = new Array(BAR_COUNT).fill(0);

let globalGlow = 0;
let lowEnergy = 0;
let previousLow = 0;

/* ゆっくり消える光 */
let flash = 0;
let animationTime = 0;

function getFrequencyValue(freq) {
  if (!analyser || !frequencyData || !audioContext) return 0;

  const nyquist = audioContext.sampleRate / 2;
  const index = Math.floor(freq / nyquist * frequencyData.length);

  return frequencyData[
    Math.max(0, Math.min(index, frequencyData.length - 1))
  ] / 255;
}

function getBandEnergy(startFreq, endFreq) {
  if (!analyser || !frequencyData || !audioContext) return 0;

  const nyquist = audioContext.sampleRate / 2;

  const start = Math.max(
    0,
    Math.floor(startFreq / nyquist * frequencyData.length)
  );

  const end = Math.min(
    frequencyData.length - 1,
    Math.ceil(endFreq / nyquist * frequencyData.length)
  );

  let total = 0;
  let count = 0;

  for (let i = start; i <= end; i++) {
    total += frequencyData[i] / 255;
    count++;
  }

  return count ? total / count : 0;
}

function getLowFrequency() {
  return getBandEnergy(35, 150) * sensitivity;
}

function getBarValue(index) {
  const minFreq = 35;
  const maxFreq = 12000;

  const ratio = index / (BAR_COUNT - 1);
  const freq = minFreq * Math.pow(maxFreq / minFreq, ratio);

  const value = getFrequencyValue(freq);

  return Math.min(1, Math.pow(value * sensitivity, 0.85));
}

function updateAudio() {
  if (isRunning && analyser && frequencyData) {
    analyser.getByteFrequencyData(frequencyData);

    lowEnergy = getLowFrequency();

    const targetGlow = Math.min(1, lowEnergy * 2.8);

    globalGlow += (targetGlow - globalGlow) * 0.075;

    /* 低音の立ち上がりで光を少しずつ重ねる */
    const rising = lowEnergy - previousLow;

    if (rising > 0.035) {
      flash = Math.min(1, flash + rising * 2.2);
    }

    previousLow = lowEnergy;

    for (let i = 0; i < BAR_COUNT; i++) {
      const value = getBarValue(i);
      bars[i] += (value - bars[i]) * 0.35;

      if (bars[i] > peaks[i]) {
        peaks[i] = bars[i];
      } else {
        peaks[i] *= 0.985;
      }
    }

  } else {
    globalGlow *= 0.985;
    lowEnergy *= 0.97;
    previousLow *= 0.97;

    for (let i = 0; i < BAR_COUNT; i++) {
      bars[i] *= 0.94;
      peaks[i] *= 0.99;
    }
  }
}

/* 背景 */
function drawBackground() {
  const bg = ctx.createRadialGradient(
    width * 0.5,
    height * 0.48,
    0,
    width * 0.5,
    height * 0.48,
    Math.max(width, height) * 0.85
  );

  bg.addColorStop(0, "#141d42");
  bg.addColorStop(0.48, "#090f25");
  bg.addColorStop(1, "#03050e");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  /* 中央の青い光 */
  const glow = ctx.createRadialGradient(
    width * 0.5,
    height * 0.55,
    0,
    width * 0.5,
    height * 0.55,
    Math.max(width, height) * 0.7
  );

  glow.addColorStop(
    0,
    `rgba(75,110,255,${0.035 + globalGlow * 0.24})`
  );

  glow.addColorStop(
    0.5,
    `rgba(70,90,230,${0.025 + globalGlow * 0.12})`
  );

  glow.addColorStop(1, "rgba(30,50,130,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  /* 下部に広がる淡い光 */
  const lowerGlow = ctx.createRadialGradient(
    width * 0.5,
    height * 0.78,
    0,
    width * 0.5,
    height * 0.78,
    width * 0.65
  );

  lowerGlow.addColorStop(
    0,
    `rgba(95,130,255,${0.015 + globalGlow * 0.1})`
  );

  lowerGlow.addColorStop(1, "rgba(50,70,180,0)");

  ctx.fillStyle = lowerGlow;
  ctx.fillRect(0, 0, width, height);
}

/* ジワーっと消える光 */
function drawFlash() {
  if (flash <= 0.001) return;

  const radius = Math.max(width, height) * 0.8;

  const gradient = ctx.createRadialGradient(
    width * 0.5,
    height * 0.53,
    0,
    width * 0.5,
    height * 0.53,
    radius
  );

  gradient.addColorStop(
    0,
    `rgba(105,135,255,${flash * 0.095})`
  );

  gradient.addColorStop(
    0.35,
    `rgba(105,95,255,${flash * 0.065})`
  );

  gradient.addColorStop(
    0.72,
    `rgba(65,100,230,${flash * 0.025})`
  );

  gradient.addColorStop(1, "rgba(45,65,180,0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  /* 急に消えないようにゆっくり減衰 */
  flash *= 0.982;

  if (flash < 0.001) flash = 0;
}

/* 共通グロー */
function glowLine(color, blur, widthValue) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.lineWidth = widthValue;
  ctx.strokeStyle = color;
}

function roundedGlow(x, y, radius, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(20,40,120,0)");

  ctx.fillStyle = g;
  ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

/* 1. Spectrum X */
function drawSpectrum() {
  const centerY = height * 0.56;
  const usableWidth = width * 0.9;
  const startX = (width - usableWidth) / 2;
  const gap = Math.max(1.5, usableWidth / BAR_COUNT * 0.22);
  const barWidth = usableWidth / BAR_COUNT - gap;

  for (let i = 0; i < BAR_COUNT; i++) {
    const x = startX + i * (barWidth + gap);
    const value = bars[i];
    const barHeight = value * height * 0.42;

    const hue = 215 + i / BAR_COUNT * 65;

    const gradient = ctx.createLinearGradient(
      0,
      centerY - barHeight,
      0,
      centerY
    );

    gradient.addColorStop(0, `hsla(${hue},100%,85%,0.95)`);
    gradient.addColorStop(0.4, `hsla(${hue},100%,67%,0.9)`);
    gradient.addColorStop(1, `hsla(${hue},95%,48%,0.3)`);

    ctx.fillStyle = gradient;
    ctx.shadowColor = `hsla(${hue},100%,65%,0.8)`;
    ctx.shadowBlur = 10 + value * 16;

    ctx.fillRect(
      x,
      centerY - barHeight,
      barWidth,
      barHeight
    );

    /* 反射 */
    const reflection = ctx.createLinearGradient(
      0,
      centerY,
      0,
      centerY + barHeight * 0.42
    );

    reflection.addColorStop(0, `hsla(${hue},100%,70%,0.2)`);
    reflection.addColorStop(1, "rgba(50,70,180,0)");

    ctx.fillStyle = reflection;
    ctx.fillRect(
      x,
      centerY,
      barWidth,
      barHeight * 0.42
    );

    /* ピーク */
    const peakY = centerY - peaks[i] * height * 0.42;

    ctx.shadowBlur = 8;
    ctx.fillStyle = `hsla(${hue},100%,85%,0.8)`;

    ctx.fillRect(x, peakY, barWidth, 2);
  }

  ctx.shadowBlur = 0;

  const line = ctx.createLinearGradient(
    startX,
    0,
    startX + usableWidth,
    0
  );

  line.addColorStop(0, "rgba(90,120,255,0)");
  line.addColorStop(0.5, "rgba(130,160,255,0.6)");
  line.addColorStop(1, "rgba(90,120,255,0)");

  ctx.fillStyle = line;
  ctx.fillRect(startX, centerY, usableWidth, 1);
}

/* 2. Mirror Pulse */
function drawMirror() {
  const centerY = height * 0.5;
  const usableWidth = width * 0.88;
  const startX = (width - usableWidth) / 2;
  const gap = 2;
  const barWidth = usableWidth / BAR_COUNT - gap;

  for (let i = 0; i < BAR_COUNT; i++) {
    const x = startX + i * (barWidth + gap);
    const value = bars[i];
    const h = value * height * 0.34;
    const hue = 210 + i / BAR_COUNT * 70;

    const gradient = ctx.createLinearGradient(
      0,
      centerY - h,
      0,
      centerY + h
    );

    gradient.addColorStop(0, `hsla(${hue},100%,75%,0.2)`);
    gradient.addColorStop(0.5, `hsla(${hue},100%,75%,0.95)`);
    gradient.addColorStop(1, `hsla(${hue},100%,75%,0.2)`);

    ctx.fillStyle = gradient;
    ctx.shadowColor = `hsla(${hue},100%,65%,0.8)`;
    ctx.shadowBlur = 12 + value * 14;

    ctx.fillRect(x, centerY - h, barWidth, h * 2);
  }

  ctx.shadowBlur = 0;

  ctx.fillStyle = "rgba(150,180,255,0.5)";
  ctx.fillRect(0, centerY - 1, width, 2);
}

/* 3. Wave Flow */
function drawWave() {
  const colors = [
    "rgba(80,140,255,0.8)",
    "rgba(120,100,255,0.7)",
    "rgba(60,210,255,0.65)",
    "rgba(170,110,255,0.55)",
    "rgba(70,130,255,0.5)"
  ];

  const baseY = height * 0.5;
  const amplitude = height * 0.19;

  for (let layer = 0; layer < 5; layer++) {
    ctx.beginPath();

    const phase = animationTime * (0.0008 + layer * 0.00012);
    const offset = layer * 0.5;

    for (let x = 0; x <= width; x += 4) {
      const index = Math.floor(x / width * (BAR_COUNT - 1));
      const value = bars[index] || 0;

      const wave =
        Math.sin(x * 0.008 + phase + offset) * 0.5 +
        Math.sin(x * 0.014 - phase * 0.7 + offset) * 0.25;

      const y =
        baseY +
        wave * amplitude +
        (value * amplitude * 0.7) * Math.sin(x * 0.018 + phase);

      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.strokeStyle = colors[layer];
    ctx.lineWidth = 2 + layer * 0.4;
    ctx.shadowColor = colors[layer];
    ctx.shadowBlur = 14 + globalGlow * 14;
    ctx.stroke();

    ctx.shadowBlur = 0;
  }

  /* 流れる光 */
  const sweepX = (animationTime * 0.08) % (width + 200) - 100;

  const sweep = ctx.createRadialGradient(
    sweepX,
    baseY,
    0,
    sweepX,
    baseY,
    130
  );

  sweep.addColorStop(0, "rgba(160,190,255,0.18)");
  sweep.addColorStop(1, "rgba(100,130,255,0)");

  ctx.fillStyle = sweep;
  ctx.fillRect(0, 0, width, height);
}

/* 4. Hyper Radial */
function drawRadial() {
  const cx = width * 0.5;
  const cy = height * 0.5;
  const baseRadius = Math.min(width, height) * 0.2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(animationTime * 0.00012);

  /* このエフェクト固有のリング */
  for (let ring = 0; ring < 5; ring++) {
    const radius = baseRadius + ring * 27;
    const rotation = animationTime * (0.0001 + ring * 0.00003);

    ctx.beginPath();

    for (let i = 0; i < 100; i++) {
      const angle = i / 100 * Math.PI * 2 + rotation;
      const value = bars[i] || 0;
      const r = radius + value * 18;

      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();

    ctx.strokeStyle = `rgba(${100 + ring * 15},${130 + ring * 10},255,${0.25 + ring * 0.06})`;
    ctx.lineWidth = 1.2;
    ctx.shadowColor = "#708eff";
    ctx.shadowBlur = 10;
    ctx.stroke();
  }

  /* 放射状バー */
  for (let i = 0; i < BAR_COUNT; i++) {
    const angle = i / BAR_COUNT * Math.PI * 2;
    const value = bars[i];
    const inner = baseRadius * 0.65;
    const outer = inner + value * baseRadius * 1.5;

    const x1 = Math.cos(angle) * inner;
    const y1 = Math.sin(angle) * inner;
    const x2 = Math.cos(angle) * outer;
    const y2 = Math.sin(angle) * outer;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.strokeStyle = `hsla(${215 + i / BAR_COUNT * 70},100%,75%,0.8)`;
    ctx.lineWidth = 2;
    ctx.shadowColor = "#829cff";
    ctx.shadowBlur = 9;
    ctx.stroke();
  }

  ctx.restore();
  ctx.shadowBlur = 0;

  const core = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, baseRadius * 0.9
  );

  core.addColorStop(0, `rgba(130,160,255,${0.12 + globalGlow * 0.22})`);
  core.addColorStop(0.5, "rgba(80,100,220,0.08)");
  core.addColorStop(1, "rgba(40,60,160,0)");

  ctx.fillStyle = core;
  ctx.fillRect(
    cx - baseRadius,
    cy - baseRadius,
    baseRadius * 2,
    baseRadius * 2
  );
}

/* 5. Particle Storm */
const particles = [];

for (let i = 0; i < 170; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    radius: Math.random() * 0.6,
    speed: 0.2 + Math.random() * 0.8,
    size: 0.5 + Math.random() * 2,
    alpha: 0.2 + Math.random() * 0.6
  });
}

function drawParticles() {
  const cx = width * 0.5;
  const cy = height * 0.5;
  const maxRadius = Math.max(width, height) * 0.65;

  for (const p of particles) {
    const index = Math.floor(
      ((p.angle % (Math.PI * 2)) / (Math.PI * 2)) * BAR_COUNT
    );

    const value = bars[(index + BAR_COUNT) % BAR_COUNT] || 0;

    p.radius += p.speed * (0.0015 + value * 0.008);

    if (p.radius > 1) {
      p.radius = 0.03;
      p.angle = Math.random() * Math.PI * 2;
    }

    const r = p.radius * maxRadius;
    const x = cx + Math.cos(p.angle) * r;
    const y = cy + Math.sin(p.angle) * r;

    const size = p.size + value * 3;

    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);

    ctx.fillStyle = `rgba(130,165,255,${p.alpha * (0.4 + value)})`;
    ctx.shadowColor = "#779aff";
    ctx.shadowBlur = 8 + value * 12;
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  const core = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, Math.min(width, height) * 0.3
  );

  core.addColorStop(0, `rgba(100,130,255,${0.08 + globalGlow * 0.2})`);
  core.addColorStop(1, "rgba(50,70,180,0)");

  ctx.fillStyle = core;
  ctx.fillRect(0, 0, width, height);
}

/* 描画ループ */
let currentEffect = "spectrum";

document.getElementById("effectSelect").addEventListener("change", e => {
  currentEffect = e.target.value;
});

function draw() {
  requestAnimationFrame(draw);

  animationTime += 16.67;

  updateAudio();
  drawBackground();

  switch (currentEffect) {
    case "spectrum":
      drawSpectrum();
      break;

    case "mirror":
      drawMirror();
      break;

    case "wave":
      drawWave();
      break;

    case "radial":
      drawRadial();
      break;

    case "particles":
      drawParticles();
      break;
  }

  drawFlash();
}

draw();
</script>
