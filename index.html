
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Audio Visualizer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080b14;
  color: #edf3ff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  padding: 16px;
  overflow-x: hidden;
  overflow-y: auto;
}

.container {
  width: 100%;
  max-width: 950px;
  margin: auto;
}

header {
  margin-bottom: 18px;
}

header h1 {
  font-size: 23px;
  letter-spacing: 1px;
  margin: 0 0 5px;
}

header p {
  font-size: 12px;
  color: #8290ad;
  margin: 0;
}

.visual-card {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: #080c18;
  border: 1px solid #26344e;
  box-shadow: 0 12px 40px #0007;
  margin-bottom: 15px;
}

.visual-area {
  position: relative;
  height: 370px;
  min-height: 240px;
  background: #080c18;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.view-button {
  position: absolute;
  top: 13px;
  right: 13px;
  z-index: 10;
  padding: 10px 14px;
  color: white;
  background: #17243bdc;
  border: 1px solid #52658b;
  border-radius: 10px;
  font-size: 12px;
  backdrop-filter: blur(12px);
}

.status {
  padding: 12px 15px;
  border-top: 1px solid #ffffff12;
  color: #9aabc9;
  font-size: 12px;
}

.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  background: #64748b;
}

.dot.active {
  background: #36e6ae;
  box-shadow: 0 0 10px #36e6ae;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.main-button,
.secondary-button {
  flex: 1;
  min-width: 0;
  padding: 14px 8px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 600;
}

.main-button {
  color: white;
  border: none;
  background: linear-gradient(120deg, #356cf0, #8050dc);
}

.secondary-button {
  color: #dce8ff;
  border: 1px solid #394966;
  background: #172239;
}

button:disabled {
  opacity: .5;
}

.card {
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid #263550;
  border-radius: 15px;
  background: #111a2b;
}

.card h2 {
  font-size: 14px;
  margin: 0 0 18px;
}

.setting {
  margin-bottom: 21px;
}

.setting:last-child {
  margin-bottom: 0;
}

.setting-head,
.meter-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #c6d3ed;
}

.setting-value {
  color: #85aaff;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  accent-color: #668fff;
  height: 6px;
}

.meter-bg {
  width: 100%;
  height: 9px;
  overflow: hidden;
  border-radius: 20px;
  background: #27344b;
}

.meter-fill {
  width: 0%;
  height: 100%;
  border-radius: 20px;
  transition: width .06s linear;
  background: linear-gradient(90deg, #3977ff, #40e1c1);
  box-shadow: 0 0 12px #398bff80;
}

.frequency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.frequency-item {
  min-width: 0;
}

.frequency-item .meter-bg {
  height: 7px;
}

.frequency-item:nth-child(2) .meter-fill {
  background: linear-gradient(90deg, #28c8d9, #6c9dff);
}

.frequency-item:nth-child(3) .meter-fill {
  background: linear-gradient(90deg, #a16bff, #ff78bc);
}

.frequency-item small {
  display: block;
  margin-top: 6px;
  font-size: 10px;
  color: #8495b5;
}

/* FULLSCREEN */

body.fullscreen-mode {
  padding: 0;
  overflow: hidden;
}

.fullscreen-mode .container {
  max-width: none;
  width: 100%;
  height: 100dvh;
}

.fullscreen-mode header {
  display: none;
}

.fullscreen-mode .visual-card {
  position: fixed;
  inset: 0;
  z-index: 100;
  border: none;
  border-radius: 0;
  margin: 0;
}

.fullscreen-mode .visual-area {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
}

.fullscreen-mode .status,
.fullscreen-mode .controls {
  display: none;
}

.fullscreen-mode .menu-panel {
  display: none;
}

.fullscreen-mode.menu-open .menu-panel {
  display: block;
  position: fixed;
  z-index: 200;
  top: calc(60px + env(safe-area-inset-top));
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(360px, calc(100vw - 24px));
  overflow-y: auto;
  padding: 8px;
  border: 1px solid #52617c;
  border-radius: 16px;
  background: #0d1527ed;
  backdrop-filter: blur(18px);
}

.fullscreen-mode .menu-panel .card {
  background: #111a2cf5;
}

@media(max-width: 600px) {
  body { padding: 10px; }
  .visual-area { height: 300px; }
  .card { padding: 15px; }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Audio Visualizer</h1>
  <p>3D Spectrum Analyzer</p>
</header>

<section class="visual-card">

  <div class="visual-area" id="visualArea">
    <canvas id="visualizer"></canvas>
    <button class="view-button" id="viewBtn">全画面</button>
  </div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">マイク未接続</span>
  </div>

</section>

<div class="controls">
  <button class="main-button" id="startBtn">マイク開始</button>
  <button class="secondary-button" id="reconnectBtn">マイク再取得</button>
</div>

<div class="menu-panel">

  <section class="card">
    <h2>ビジュアル設定</h2>

    <div class="setting">
      <div class="setting-head">
        <span>入力レベル</span>
        <span class="setting-value" id="gainValue">50%</span>
      </div>
      <input type="range" id="gainSlider" min="0" max="100" value="50">
    </div>

    <div class="setting">
      <div class="setting-head">
        <span>表示感度</span>
        <span class="setting-value" id="sensitivityValue">70%</span>
      </div>
      <input type="range" id="sensitivitySlider" min="0" max="100" value="70">
    </div>

    <div class="setting">
      <div class="setting-head">
        <span>滑らかさ</span>
        <span class="setting-value" id="smoothValue">65%</span>
      </div>
      <input type="range" id="smoothSlider" min="0" max="95" value="65">
    </div>
  </section>

  <section class="card">
    <h2>マイク入力レベル</h2>
    <div class="meter-head">
      <span>Input</span>
      <span id="inputValue">0%</span>
    </div>
    <div class="meter-bg">
      <div class="meter-fill" id="inputMeter"></div>
    </div>
  </section>

  <section class="card">
    <h2>周波数レベル</h2>

    <div class="frequency-grid">

      <div class="frequency-item">
        <div class="meter-head">
          <span>Low</span>
          <span id="lowValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="lowMeter"></div>
        </div>
        <small>35–250 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head">
          <span>Mid</span>
          <span id="midValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="midMeter"></div>
        </div>
        <small>250–3500 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head">
          <span>High</span>
          <span id="highValue">0%</span>
        </div>
        <div class="meter-bg">
          <div class="meter-fill" id="highMeter"></div>
        </div>
        <small>3500–12000 Hz</small>
      </div>

    </div>
  </section>

</div>
</div>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let audioContext = null;
let stream = null;
let source = null;
let gainNode = null;
let analyser = null;
let inputAnalyser = null;

let frequencyData = null;
let inputData = null;

let bars = [];
let peaks = [];
let particles = [];

let smoothBands = {
  low: 0,
  mid: 0,
  high: 0
};

let currentBass = 0;
let width = 0;
let height = 0;
let dpr = 1;
let animationFrame = null;
let connectionBusy = false;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = rect.width;
  height = rect.height;

  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.max(30, Math.floor(width / 7));

  bars = Array(count).fill(0);
  peaks = Array(count).fill(0);
}

const resizeObserver = new ResizeObserver(resizeCanvas);
resizeObserver.observe($("visualArea"));
window.addEventListener("resize", resizeCanvas);

function getGain(percent) {
  return percent <= 50
    ? percent / 50 * 2
    : 2 + (percent - 50) / 50;
}

function updateSettings() {
  $("gainValue").textContent = $("gainSlider").value + "%";
  $("sensitivityValue").textContent = $("sensitivitySlider").value + "%";
  $("smoothValue").textContent = $("smoothSlider").value + "%";

  if (gainNode && audioContext) {
    gainNode.gain.setTargetAtTime(
      getGain(Number($("gainSlider").value)),
      audioContext.currentTime,
      0.05
    );
  }
}

["gainSlider", "sensitivitySlider", "smoothSlider"].forEach(id => {
  $(id).addEventListener("input", updateSettings);
});

function setStatus(active, message) {
  $("statusText").textContent = message;
  $("statusDot").classList.toggle("active", active);
}

async function stopMicrophone() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  source = null;
  gainNode = null;
  analyser = null;
  inputAnalyser = null;
  frequencyData = null;
  inputData = null;

  if (audioContext) {
    try {
      await audioContext.close();
    } catch (e) {}
    audioContext = null;
  }
}

async function startMicrophone() {
  if (connectionBusy) return;

  connectionBusy = true;
  $("startBtn").disabled = true;
  $("reconnectBtn").disabled = true;

  setStatus(false, "マイクを取得しています...");
  $("startBtn").textContent = "接続中...";

  try {
    await stopMicrophone();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    source = audioContext.createMediaStreamSource(stream);

    inputAnalyser = audioContext.createAnalyser();
    inputAnalyser.fftSize = 2048;
    inputAnalyser.smoothingTimeConstant = 0.2;

    gainNode = audioContext.createGain();
    gainNode.gain.value = getGain(Number($("gainSlider").value));

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 8192;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -15;
    analyser.smoothingTimeConstant = 0.2;

    source.connect(inputAnalyser);
    source.connect(gainNode);
    gainNode.connect(analyser);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
    inputData = new Float32Array(inputAnalyser.fftSize);

    smoothBands = { low: 0, mid: 0, high: 0 };
    particles = [];

    setStatus(true, "マイク接続中");
    $("startBtn").textContent = "マイク接続済み";

  } catch (error) {
    console.error(error);

    await stopMicrophone();

    setStatus(false, "マイクを取得できませんでした");
    $("startBtn").textContent = "マイク開始";

    alert(
      "マイクを取得できませんでした。\n\nSafariのマイク許可設定と、ページがHTTPSで開かれているかを確認してください。"
    );

  } finally {
    connectionBusy = false;
    $("startBtn").disabled = false;
    $("reconnectBtn").disabled = false;
  }
}

$("startBtn").addEventListener("click", () => {
  if (!stream) startMicrophone();
});

$("reconnectBtn").addEventListener("click", startMicrophone);

function getFrequencyIndex(hz) {
  return Math.round(hz * analyser.fftSize / audioContext.sampleRate);
}

function getBandLevel(minHz, maxHz) {
  const min = Math.max(0, getFrequencyIndex(minHz));
  const max = Math.min(frequencyData.length - 1, getFrequencyIndex(maxHz));

  let sum = 0;
  let count = 0;

  for (let i = min; i <= max; i++) {
    const v = frequencyData[i] / 255;
    sum += v * v;
    count++;
  }

  return count ? Math.sqrt(sum / count) : 0;
}

function updateMeters() {
  if (!inputAnalyser || !analyser) return;

  inputAnalyser.getFloatTimeDomainData(inputData);

  let sum = 0;

  for (let i = 0; i < inputData.length; i++) {
    sum += inputData[i] * inputData[i];
  }

  const rms = Math.sqrt(sum / inputData.length);
  const db = 20 * Math.log10(Math.max(rms, 0.000001));

  const input = Math.max(0, Math.min(100, (db + 60) * 2));

  $("inputMeter").style.width = input + "%";
  $("inputValue").textContent = Math.round(input) + "%";

  const low = getBandLevel(35, 250);
  const mid = getBandLevel(250, 3500);
  const high = getBandLevel(3500, 12000);

  const smoothing = Number($("smoothSlider").value) / 100 * 0.9;

  smoothBands.low =
    smoothBands.low * smoothing + low * (1 - smoothing);

  smoothBands.mid =
    smoothBands.mid * smoothing + mid * (1 - smoothing);

  smoothBands.high =
    smoothBands.high * smoothing + high * (1 - smoothing);

  const lowP = Math.min(100, smoothBands.low * 180);
  const midP = Math.min(100, smoothBands.mid * 180);
  const highP = Math.min(100, smoothBands.high * 180);

  $("lowMeter").style.width = lowP + "%";
  $("midMeter").style.width = midP + "%";
  $("highMeter").style.width = highP + "%";

  $("lowValue").textContent = Math.round(lowP) + "%";
  $("midValue").textContent = Math.round(midP) + "%";
  $("highValue").textContent = Math.round(highP) + "%";

  currentBass = smoothBands.low;
}

/* 背景 */
function drawBackground(time) {
  const bass = Math.min(1, currentBass * 5);
  const pulse = bass * 0.35;

  ctx.fillStyle = "#080c18";
  ctx.fillRect(0, 0, width, height);

  const gradient = ctx.createRadialGradient(
    width / 2,
    height * 0.85,
    10,
    width / 2,
    height * 0.85,
    height
  );

  gradient.addColorStop(0, `rgba(40,100,230,${0.08 + pulse})`);
  gradient.addColorStop(0.5, `rgba(40,65,150,${0.06 + pulse * 0.3})`);
  gradient.addColorStop(1, "#080c18");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  // 奥行きのある床面グリッド
  const center = width / 2;
  const horizon = height * 0.83;

  ctx.lineWidth = 1;

  for (let i = 0; i < 10; i++) {
    const t = i / 9;
    const y = horizon + t * t * height * 0.2;

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.strokeStyle = `rgba(80,145,255,${0.025 + t * 0.025})`;
    ctx.stroke();
  }

  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(center, horizon);
    ctx.lineTo(center + i * width * 0.12, height);
    ctx.strokeStyle = "rgba(85,145,255,0.045)";
    ctx.stroke();
  }

  // 低音に反応する波紋
  const radius = 45 + bass * 100 + Math.sin(time * 0.0015) * 5;

  ctx.beginPath();
  ctx.ellipse(center, horizon, radius * 1.8, radius * 0.4, 0, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(65,140,255,${0.05 + pulse * 0.4})`;
  ctx.lineWidth = 2 + bass * 4;
  ctx.stroke();
}

/* 浮遊粒子 */
function drawParticles() {
  if (currentBass > 0.025 && Math.random() < 0.35) {
    particles.push({
      x: Math.random() * width,
      y: height * (0.55 + Math.random() * 0.4),
      size: 1 + Math.random() * 2,
      life: 1,
      speed: 0.4 + Math.random() * 1.2
    });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.y -= p.speed;
    p.life -= 0.009;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(120,180,255,${p.life * 0.65})`;
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  }

  if (particles.length > 100) {
    particles.splice(0, 10);
  }
}

/* 立体バーの描画 */
function draw3DBar(x, y, barWidth, barHeight, depth, hue, intensity) {
  const tilt = depth * 0.65;
  const bottom = height * 0.83;
  const right = x + barWidth;

  // 発光
  ctx.shadowBlur = 8 + intensity * 18;
  ctx.shadowColor = `hsla(${hue},100%,65%,0.85)`;

  // 正面
  const front = ctx.createLinearGradient(0, bottom, 0, y);
  front.addColorStop(0, `hsla(${hue},100%,48%,0.95)`);
  front.addColorStop(0.45, `hsla(${hue + 12},100%,62%,0.95)`);
  front.addColorStop(1, `hsla(${hue + 30},100%,78%,0.95)`);

  ctx.fillStyle = front;
  ctx.beginPath();
  ctx.roundRect(x, y, barWidth, barHeight, 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // 右側面
  ctx.beginPath();
  ctx.moveTo(right, y);
  ctx.lineTo(right + depth, y - tilt);
  ctx.lineTo(right + depth, bottom - tilt);
  ctx.lineTo(right, bottom);
  ctx.closePath();

  ctx.fillStyle = `hsla(${hue - 12},75%,25%,0.96)`;
  ctx.fill();

  ctx.strokeStyle = `hsla(${hue},90%,65%,0.4)`;
  ctx.lineWidth = 0.6;
  ctx.stroke();

  // 上面
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + depth, y - tilt);
  ctx.lineTo(right + depth, y - tilt);
  ctx.lineTo(right, y);
  ctx.closePath();

  const top = ctx.createLinearGradient(x, y, x, y - tilt);
  top.addColorStop(0, `hsla(${hue + 20},100%,65%,0.95)`);
  top.addColorStop(1, `hsla(${hue + 40},100%,90%,1)`);

  ctx.fillStyle = top;
  ctx.fill();

  // 正面の光沢ライン
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 2);
  ctx.lineTo(x + 2, bottom - 2);
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* Spectrum */
function drawSpectrum(time) {
  if (!analyser || !frequencyData) {
    drawIdle(time);
    return;
  }

  analyser.getByteFrequencyData(frequencyData);
  updateMeters();

  const sensitivity = Number($("sensitivitySlider").value) / 100;
  const smooth = Number($("smoothSlider").value) / 100;

  const count = bars.length;
  const gap = Math.max(2, width / count * 0.23);
  const barWidth = Math.max(1, width / count - gap);
  const depth = Math.min(8, Math.max(3, width * 0.009));

  const centerY = height * 0.83;
  const maxHeight = height * 0.66;

  drawBackground(time);
  drawParticles();

  const minHz = 35;
  const maxHz = 12000;

  // バーを奥側から順番に描画
  for (let i = 0; i < count; i++) {
    const position = i / count;

    const hz = minHz * Math.pow(maxHz / minHz, position);

    const index = Math.min(
      frequencyData.length - 1,
      Math.max(
        0,
        Math.round(hz * analyser.fftSize / audioContext.sampleRate)
      )
    );

    let value = frequencyData[index] / 255;

    // 周波数ごとのバランス
    if (position < 0.25) value *= 1.35;
    else if (position > 0.75) value *= 1.18;

    // 隣接周波数を混ぜる
    if (index > 1 && index < frequencyData.length - 2) {
      const neighbor =
        (frequencyData[index - 1] +
         frequencyData[index + 1]) / 510;

      value = value * 0.78 + neighbor * 0.22;
    }

    value = Math.min(1, value * (0.35 + sensitivity * 2.4));

    bars[i] =
      bars[i] * smooth * 0.65 +
      value * (1 - smooth * 0.65);

    const barHeight = Math.max(2, bars[i] * maxHeight);

    peaks[i] = Math.max(
      bars[i],
      peaks[i] - 0.004 - (1 - smooth) * 0.006
    );

    const x = i * (barWidth + gap);
    const y = centerY - barHeight;
    const hue = 210 + position * 115;

    // 立体バー
    draw3DBar(
      x,
      y,
      barWidth,
      barHeight,
      depth,
      hue,
      bars[i]
    );

    // ピークライン
    const peakY = centerY - peaks[i] * maxHeight;

    ctx.fillStyle = `hsla(${hue + 25},100%,85%,0.95)`;
    ctx.fillRect(x, peakY - 2, barWidth, 2);

    // 床面への反射
    const reflection = ctx.createLinearGradient(
      0, centerY, 0, centerY + barHeight * 0.28
    );

    reflection.addColorStop(0, `hsla(${hue},100%,65%,0.18)`);
    reflection.addColorStop(1, `hsla(${hue},100%,60%,0)`);

    ctx.fillStyle = reflection;
    ctx.fillRect(x, centerY + 3, barWidth, barHeight * 0.28);
  }

  // 中央の光るライン
  const line = ctx.createLinearGradient(0, 0, width, 0);

  line.addColorStop(0, "rgba(70,120,255,0)");
  line.addColorStop(0.5, "rgba(120,190,255,0.95)");
  line.addColorStop(1, "rgba(70,120,255,0)");

  ctx.shadowBlur = 15;
  ctx.shadowColor = "#4f9fff";
  ctx.strokeStyle = line;
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.moveTo(0, centerY);
  ctx.lineTo(width, centerY);
  ctx.stroke();

  ctx.shadowBlur = 0;

  // 低音の光が画面下部に広がる
  const bassGlow = Math.min(1, currentBass * 6);

  const glow = ctx.createRadialGradient(
    width / 2, centerY, 0,
    width / 2, centerY, width * 0.55
  );

  glow.addColorStop(0, `rgba(65,130,255,${bassGlow * 0.18})`);
  glow.addColorStop(1, "rgba(65,130,255,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);
}

/* 待機表示 */
function drawIdle(time) {
  ctx.fillStyle = "#080c18";
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height * 0.68;
  const pulse = 1 + Math.sin(time * 0.002) * 0.06;

  ctx.beginPath();
  ctx.arc(cx, cy, 30 * pulse, 0, Math.PI * 2);
  ctx.strokeStyle = "#578dff";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#578dff";
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#9aafd8";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("MICROPHONE STANDBY", cx, cy + 65);
}

/* アニメーション */
function animate(time) {
  ctx.clearRect(0, 0, width, height);
  drawSpectrum(time);
  animationFrame = requestAnimationFrame(animate);
}

function startAnimation() {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(animate);
}

/* 全画面切り替え */
$("viewBtn").addEventListener("click", () => {
  const body = document.body;

  if (!body.classList.contains("fullscreen-mode")) {
    body.classList.add("fullscreen-mode");
    body.classList.remove("menu-open");
    $("viewBtn").textContent = "メニュー";
  } else if (!body.classList.contains("menu-open")) {
    body.classList.add("menu-open");
    $("viewBtn").textContent = "メニューを閉じる";
  } else {
    body.classList.remove("menu-open");
    $("viewBtn").textContent = "メニュー";
  }

  requestAnimationFrame(resizeCanvas);
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    document.body.classList.remove("fullscreen-mode", "menu-open");
    $("viewBtn").textContent = "全画面";
    requestAnimationFrame(resizeCanvas);
  }
});

updateSettings();
resizeCanvas();
startAnimation();

</script>
</body>
