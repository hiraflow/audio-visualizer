
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Audio Visualizer</title>

<style>
* { box-sizing: border-box; }

html {
  min-height: 100%;
  overflow-y: auto;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px 16px calc(35px + env(safe-area-inset-bottom));
  background: #090b12;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
}

header { margin-bottom: 20px; }

h1 {
  font-size: 25px;
  margin: 0 0 5px;
  letter-spacing: 1px;
}

.subtitle {
  color: #8992a8;
  font-size: 12px;
}

.card {
  background: #141925;
  border: 1px solid #242c3c;
  border-radius: 17px;
  padding: 16px;
  margin-bottom: 15px;
}

.visual-area {
  width: 100%;
  height: clamp(220px, 38vh, 360px);
  min-height: 220px;
  position: relative;
  background: #080c16;
  border: 1px solid #202a3d;
  border-radius: 13px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.status {
  color: #8e9ab2;
  font-size: 12px;
  margin-top: 12px;
  text-align: center;
}

.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
}

button {
  border: 1px solid #303b50;
  border-radius: 10px;
  padding: 11px 5px;
  color: #c9d2e5;
  background: #1c2535;
  font-size: 12px;
  cursor: pointer;
  min-width: 0;
}

button.active {
  background: #315be5;
  border-color: #5278ff;
  color: white;
}

button.start {
  grid-column: span 4;
  background: #315be5;
  border-color: #5278ff;
  color: white;
  font-size: 14px;
  font-weight: bold;
  padding: 14px;
}

button:disabled { opacity: .5; }

.setting { margin: 17px 0; }

.setting-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
  font-size: 13px;
}

.setting-value {
  color: #7fa4ff;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: #6389ff;
  height: 25px;
  cursor: pointer;
}

.note {
  color: #8490a6;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 5px;
}

.meter-row {
  display: grid;
  grid-template-columns: 75px 1fr 40px;
  align-items: center;
  gap: 9px;
  margin: 13px 0;
  font-size: 12px;
}

.meter-bg {
  height: 9px;
  background: #252e40;
  border-radius: 20px;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3977ff, #54e6d0);
  border-radius: 20px;
  transition: width .06s linear;
}

.band-low { background: linear-gradient(90deg,#ff9b45,#ffca68); }
.band-mid { background: linear-gradient(90deg,#3e8dff,#7c9fff); }
.band-high { background: linear-gradient(90deg,#b66cff,#f17dff); }

.frequency-label {
  color: #8d9bb5;
  font-size: 11px;
  margin-top: 2px;
}

@media(max-width: 420px) {
  body { padding-left: 12px; padding-right: 12px; }
  .card { padding: 13px; }
  .controls { gap: 6px; }
  button { font-size: 11px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Audio Visualizer</h1>
  <div class="subtitle">Microphone Audio Visualization</div>
</header>

<section class="card">
  <div class="visual-area">
    <canvas id="visualizer"></canvas>
  </div>

  <div class="status" id="status">マイクを開始してください</div>

  <div class="controls">
    <button class="start" id="startBtn">マイクを開始</button>
    <button class="mode active" data-mode="spectrum">Spectrum</button>
    <button class="mode" data-mode="circle">Circle</button>
    <button class="mode" data-mode="wave">Wave</button>
    <button class="mode" data-mode="particles">Particles</button>
  </div>
</section>

<section class="card">

  <div class="setting">
    <div class="setting-head">
      <span>入力レベル（マイク音量）</span>
      <span class="setting-value" id="gainValue">200%</span>
    </div>
    <input id="gainSlider" type="range" min="100" max="300" value="200" step="1">
    <div class="note">
      200%を標準として、100〜300%で増幅量を調整できます。
    </div>
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>マイク感度（表示感度）</span>
      <span class="setting-value" id="sensitivityValue">70%</span>
    </div>
    <input id="sensitivitySlider" type="range" min="20" max="100" value="70">
    <div class="note">
      70%を標準として、ビジュアルの反応の強さを調整します。
    </div>
  </div>

  <div class="setting">
    <div class="setting-head">
      <span>表示の滑らかさ</span>
      <span class="setting-value" id="smoothValue">65%</span>
    </div>
    <input id="smoothSlider" type="range" min="0" max="95" value="65">
  </div>

</section>

<section class="card">
  <div class="setting-head">
    <strong>マイク入力メーター</strong>
    <span class="setting-value" id="inputValue">0%</span>
  </div>

  <div class="meter-bg" style="height:13px">
    <div class="meter-fill" id="inputMeter"></div>
  </div>

  <div class="note">
    増幅前のマイク入力を表示しています。
  </div>
</section>

<section class="card">
  <div class="setting-head">
    <strong>周波数別レベル</strong>
    <span class="frequency-label">Hz</span>
  </div>

  <div class="meter-row">
    <span>低音</span>
    <div>
      <div class="meter-bg">
        <div class="meter-fill band-low" id="lowMeter"></div>
      </div>
      <div class="frequency-label">35–250 Hz</div>
    </div>
    <span class="meter-number" id="lowValue">0%</span>
  </div>

  <div class="meter-row">
    <span>中音</span>
    <div>
      <div class="meter-bg">
        <div class="meter-fill band-mid" id="midMeter"></div>
      </div>
      <div class="frequency-label">250–3500 Hz</div>
    </div>
    <span class="meter-number" id="midValue">0%</span>
  </div>

  <div class="meter-row">
    <span>高音</span>
    <div>
      <div class="meter-bg">
        <div class="meter-fill band-high" id="highMeter"></div>
      </div>
      <div class="frequency-label">3500–12000 Hz</div>
    </div>
    <span class="meter-number" id="highValue">0%</span>
  </div>
</section>

</div>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("status");

const gainSlider = document.getElementById("gainSlider");
const sensitivitySlider = document.getElementById("sensitivitySlider");
const smoothSlider = document.getElementById("smoothSlider");

const gainValue = document.getElementById("gainValue");
const sensitivityValue = document.getElementById("sensitivityValue");
const smoothValue = document.getElementById("smoothValue");

let audioContext;
let stream;
let source;
let gainNode;
let analyser;
let inputAnalyser;

let frequencyData;
let timeData;
let inputTimeData;

let mode = "spectrum";
let running = false;

let sensitivity = 0.7;
let smooth = 0.65;
let inputGain = 2;

let smoothedLow = 0;
let smoothedMid = 0;
let smoothedHigh = 0;

let particles = [];

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

gainSlider.addEventListener("input", () => {
  inputGain = Number(gainSlider.value) / 100;
  gainValue.textContent = gainSlider.value + "%";

  if (gainNode && audioContext) {
    gainNode.gain.setTargetAtTime(
      inputGain,
      audioContext.currentTime,
      0.03
    );
  }
});

sensitivitySlider.addEventListener("input", () => {
  sensitivity = Number(sensitivitySlider.value) / 100;
  sensitivityValue.textContent = sensitivitySlider.value + "%";
});

smoothSlider.addEventListener("input", () => {
  smooth = Number(smoothSlider.value) / 100;
  smoothValue.textContent = smoothSlider.value + "%";
});

document.querySelectorAll(".mode").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    mode = button.dataset.mode;
  });
});

startBtn.addEventListener("click", async () => {
  if (running) return;

  try {
    statusText.textContent = "マイクに接続中...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    source = audioContext.createMediaStreamSource(stream);

    // 増幅前の入力測定用
    inputAnalyser = audioContext.createAnalyser();
    inputAnalyser.fftSize = 2048;
    inputAnalyser.smoothingTimeConstant = 0;

    // ビジュアル用の増幅
    gainNode = audioContext.createGain();
    gainNode.gain.value = inputGain;

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 8192;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -15;
    analyser.smoothingTimeConstant = 0.2;

    source.connect(inputAnalyser);
    source.connect(gainNode);
    gainNode.connect(analyser);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    inputTimeData = new Uint8Array(inputAnalyser.fftSize);

    running = true;
    startBtn.textContent = "マイク接続中";
    startBtn.disabled = true;
    statusText.textContent = "マイク入力を取得中";

    draw();

  } catch (error) {
    console.error(error);
    statusText.textContent = "マイクに接続できませんでした";
    alert("マイクへのアクセスを許可してください。");
  }
});

function getInputLevel() {
  inputAnalyser.getByteTimeDomainData(inputTimeData);

  let sum = 0;

  for (let i = 0; i < inputTimeData.length; i++) {
    const v = (inputTimeData[i] - 128) / 128;
    sum += v * v;
  }

  const rms = Math.sqrt(sum / inputTimeData.length);
  const db = 20 * Math.log10(Math.max(rms, 0.00001));

  return Math.max(0, Math.min(100, (db + 60) * 2));
}

function getBand(minHz, maxHz) {
  const nyquist = audioContext.sampleRate / 2;
  const binWidth = nyquist / analyser.frequencyBinCount;

  const start = Math.max(0, Math.floor(minHz / binWidth));
  const end = Math.min(
    analyser.frequencyBinCount - 1,
    Math.ceil(maxHz / binWidth)
  );

  let sum = 0;
  let count = 0;

  for (let i = start; i <= end; i++) {
    const db = (frequencyData[i] / 255) * 85 - 100;
    const amplitude = Math.pow(10, db / 20);

    sum += amplitude * amplitude;
    count++;
  }

  const rms = Math.sqrt(sum / Math.max(1, count));
  const db = 20 * Math.log10(Math.max(rms, 0.000001));

  return Math.max(0, Math.min(100, (db + 78) * 2.2));
}

function updateMeters() {
  const input = getInputLevel();

  document.getElementById("inputMeter").style.width = input + "%";
  document.getElementById("inputValue").textContent = Math.round(input) + "%";

  const low = getBand(35, 250) * 1.5;
  const mid = getBand(250, 3500);
  const high = getBand(3500, 12000) * 1.3;

  const release = smooth;
  const attack = 0.25;

  function blend(oldValue, newValue) {
    const factor = newValue > oldValue ? attack : release;
    return oldValue * factor + newValue * (1 - factor);
  }

  smoothedLow = blend(smoothedLow, low);
  smoothedMid = blend(smoothedMid, mid);
  smoothedHigh = blend(smoothedHigh, high);

  setMeter("low", smoothedLow);
  setMeter("mid", smoothedMid);
  setMeter("high", smoothedHigh);
}

function setMeter(name, value) {
  const v = Math.max(0, Math.min(100, value * (sensitivity * 2)));

  document.getElementById(name + "Meter").style.width = v + "%";
  document.getElementById(name + "Value").textContent = Math.round(v) + "%";
}

function draw() {
  if (!running) return;

  requestAnimationFrame(draw);

  analyser.getByteFrequencyData(frequencyData);
  analyser.getByteTimeDomainData(timeData);

  updateMeters();

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  ctx.clearRect(0, 0, width, height);

  if (mode === "spectrum") drawSpectrum(width, height);
  if (mode === "circle") drawCircle(width, height);
  if (mode === "wave") drawWave(width, height);
  if (mode === "particles") drawParticles(width, height);
}

function drawSpectrum(w, h) {
  const bars = 100;
  const gap = 2;
  const barWidth = w / bars;

  for (let i = 0; i < bars; i++) {
    const ratio = i / bars;
    const freq = Math.floor(Math.pow(12000 / 35, ratio) * 35);

    const bin = Math.floor(
      freq / (audioContext.sampleRate / analyser.fftSize)
    );

    const value = frequencyData[Math.min(bin, frequencyData.length - 1)] || 0;

    let boost = 1;
    if (freq < 250) boost = 1.5;
    else if (freq > 3500) boost = 1.3;

    const level = Math.min(255, value * boost * sensitivity * 2);
    const barHeight = (level / 255) * h * 0.9;
    const hue = 210 + ratio * 100;

    ctx.fillStyle = `hsl(${hue}, 90%, 62%)`;
    ctx.fillRect(
      i * barWidth + gap / 2,
      h - barHeight,
      Math.max(1, barWidth - gap),
      barHeight
    );
  }
}

function drawCircle(w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const baseRadius = Math.min(w, h) * 0.22;
  const count = 160;

  ctx.beginPath();

  for (let i = 0; i < count; i++) {
    const index = Math.floor(i / count * frequencyData.length);
    const value = frequencyData[index] * sensitivity * 2;
    const radius = baseRadius + value * 0.35;

    const angle = (i / count) * Math.PI * 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.closePath();
  ctx.strokeStyle = "#70a0ff";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#397aff";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawWave(w, h) {
  ctx.beginPath();

  for (let i = 0; i < timeData.length; i++) {
    const x = i / timeData.length * w;
    const raw = (timeData[i] - 128) / 128;
    const y = h / 2 + raw * h * 0.42 * (sensitivity * 2);

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.strokeStyle = "#70a0ff";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#397aff";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawParticles(w, h) {
  const energy = (
    smoothedLow + smoothedMid + smoothedHigh
  ) / 3;

  if (Math.random() < 0.25 + energy / 180) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      size: 1 + Math.random() * 3,
      speed: 0.5 + Math.random() * 2,
      life: 1
    });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.y -= p.speed * (1 + energy / 30);
    p.life -= 0.008;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(100,160,255,${p.life})`;
    ctx.fill();

    if (p.life <= 0 || p.y < 0) {
      particles.splice(i, 1);
    }
  }
}
</script>
</body>
</html>
