
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Audio Visualizer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f4f6ff;font-family:system-ui,sans-serif;padding:15px}
.app{max-width:900px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:17px;letter-spacing:2px;margin:0}
small,.note{color:#8496ae}
.status{font-size:12px;color:#75ddb3}
.screen{height:min(60vh,520px);min-height:280px;background:radial-gradient(ellipse,#17243c,#080b12 75%);border:1px solid #29364b;border-radius:16px;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.tag{position:absolute;top:12px;left:13px;font-size:11px;letter-spacing:2px;color:#b5c8e5}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
button{background:#151e2d;border:1px solid #303e55;color:#cbd8ed;border-radius:10px;padding:12px 4px;font-size:12px}
button.active{background:#254b70;border-color:#64baff;color:white}
.controls{display:flex;gap:8px;margin-bottom:14px}
.controls button{flex:1}
.primary{background:#267bd0;color:white;border-color:#4899ed;font-weight:bold}
button:disabled{opacity:.4}
.panel{background:#111824;border:1px solid #29364b;padding:15px;border-radius:13px;margin-bottom:12px}
.setting{display:flex;justify-content:space-between;font-size:12px;color:#aabbd2;margin-bottom:8px}
input[type=range]{width:100%;accent-color:#65baff;margin-bottom:14px}
.meter{height:7px;background:#28354b;border-radius:10px;overflow:hidden}
#meter{height:100%;width:0;background:linear-gradient(90deg,#28baff,#9d73ff,#ff65b7);transition:width .04s}
.note{font-size:11px;line-height:1.7}
@media(max-width:450px){body{padding:11px}.screen{height:42vh;min-height:260px}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>AUDIO VISUALIZER</h1><small>REAL-TIME AUDIO REACTIVE</small></div>
<div class="status" id="status">● STANDBY</div>
</header>

<div class="screen">
<canvas id="visual"></canvas>
<div class="tag" id="effectName">SPECTRUM</div>
</div>

<div class="modes">
<button class="active" data-mode="spectrum">▥<br>スペクトラム</button>
<button data-mode="circle">◎<br>サークル</button>
<button data-mode="wave">〰<br>ウェーブ</button>
<button data-mode="particles">✧<br>パーティクル</button>
</div>

<div class="controls">
<button class="primary" id="start">▶ マイク開始</button>
<button id="stop" disabled>■ 停止</button>
<button id="full">⛶ 全画面</button>
</div>

<div class="panel">
<div class="setting"><span>感度</span><span id="sensVal">200%</span></div>
<input id="sens" type="range" min="50" max="400" value="200">
<div class="setting"><span>滑らかさ</span><span id="smoothVal">65%</span></div>
<input id="smooth" type="range" min="0" max="95" value="65">
<div class="setting"><span>音声レベル</span><span id="level">0%</span></div>
<div class="meter"><div id="meter"></div></div>
</div>

<p class="note" id="message">マイクを開始して許可してください。iPadのスピーカーから音楽を流すと反応します。</p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('visual'),ctx=canvas.getContext('2d');
let audio=null,stream=null,analyser=null;
let freq=null,wave=null,mode='spectrum';
let sensitivity=2,smoothing=.65,level=0;
let particles=[],W=0,H=0,dpr=1;
let smoothBars=new Float32Array(100);
let smoothLevel=0;

const colors=['#35c5ff','#5e91ff','#9874ff','#e779ff','#ff72bc'];

function resize(){
 const r=canvas.getBoundingClientRect();
 dpr=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(canvas);
resize();

function glow(color,width=2){
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.shadowColor=color;
 ctx.shadowBlur=14;
}

function spectrum(){
 const n=80,bw=W/n;
 for(let i=0;i<n;i++){
  let index=Math.floor(Math.pow(i/n,1.7)*freq.length);
  let raw=freq[index]/255;
  let v=Math.pow(raw,.65)*H*.85*sensitivity/2;
  v=Math.min(H*.9,v);
  smoothBars[i]=Math.max(v,smoothBars[i]*.91);
  let height=smoothBars[i];
  let x=i*bw+1,y=H-height;
  let g=ctx.createLinearGradient(0,y,0,H);
  g.addColorStop(0,colors[Math.floor(i/n*5)]);
  g.addColorStop(1,'#2465c5');
  ctx.fillStyle=g;
  ctx.shadowColor=colors[Math.floor(i/n*5)];
  ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.roundRect(x,y,Math.max(1,bw-2),height,3);
  ctx.fill();
 }
 ctx.shadowBlur=0;
}

function circle(){
 const cx=W/2,cy=H/2,r=Math.min(W,H)*.2;
 for(let i=0;i<180;i++){
  let a=i/180*Math.PI*2-Math.PI/2;
  let index=Math.floor(i/180*freq.length);
  let v=freq[index]/255;
  let len=8+Math.pow(v,.65)*H*.28*sensitivity/2;
  glow(colors[Math.floor(i/180*5)],2);
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  ctx.lineTo(cx+Math.cos(a)*(r+len),cy+Math.sin(a)*(r+len));
  ctx.stroke();
 }
 ctx.shadowBlur=0;
 ctx.fillStyle='white';
 ctx.textAlign='center';
 ctx.font='600 13px system-ui';
 ctx.fillText('AUDIO',cx,cy+4);
}

function drawWave(){
 for(let line=0;line<3;line++){
  ctx.beginPath();
  for(let i=0;i<wave.length;i++){
   let x=i/(wave.length-1)*W;
   let v=(wave[i]-128)/128*H*.42*sensitivity/2;
   let y=H/2+v*(line===0?1:line===1?.65:.35);
   if(i===0)ctx.moveTo(x,y);
   else ctx.lineTo(x,y);
  }
  glow(colors[line+1],line===0?2.5:1.5);
  ctx.globalAlpha=1-line*.23;
  ctx.stroke();
 }
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function drawParticles(){
 if(Math.random()<.08+level/100*.8){
  particles.push({
   x:Math.random()*W,y:H+5,
   v:1+Math.random()*3+level/100*5,
   r:1+Math.random()*3,
   c:colors[Math.floor(Math.random()*5)],a:1
  });
 }
 for(let p of particles){
  p.y-=p.v;
  p.x+=Math.sin(p.y*.025)*.7;
  p.a-=.0025;
  ctx.globalAlpha=Math.max(0,p.a);
  ctx.fillStyle=p.c;
  ctx.shadowColor=p.c;
  ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
 }
 particles=particles.filter(p=>p.a>0&&p.y>-10);
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function render(){
 requestAnimationFrame(render);
 ctx.clearRect(0,0,W,H);

 if(analyser){
  analyser.smoothingTimeConstant=smoothing;
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(wave);

  let sum=0;
  for(let v of wave){
   let sample=(v-128)/128;
   sum+=sample*sample;
  }
  let rms=Math.sqrt(sum/wave.length);
  let target=Math.min(100,rms*500*sensitivity);
  smoothLevel+=(target-smoothLevel)*.3;
  level=Math.round(smoothLevel);
 }else{
  level=0;
  smoothLevel=0;
 }

 $('level').textContent=level+'%';
 $('meter').style.width=level+'%';

 if(analyser){
  if(mode==='spectrum')spectrum();
  else if(mode==='circle')circle();
  else if(mode==='wave')drawWave();
  else drawParticles();
 }else{
  let t=performance.now()/1000;
  for(let i=0;i<50;i++){
   ctx.fillStyle=colors[i%5];
   ctx.globalAlpha=.4;
   ctx.fillRect(i/50*W,H/2+Math.sin(i*.24+t)*20,3,3);
  }
  ctx.globalAlpha=1;
 }
}
render();

document.querySelectorAll('[data-mode]').forEach(b=>{
 b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
  $('effectName').textContent=mode.toUpperCase();
  particles=[];
 };
});

$('sens').oninput=e=>{
 sensitivity=e.target.value/100;
 $('sensVal').textContent=e.target.value+'%';
};
$('smooth').oninput=e=>{
 smoothing=e.target.value/100;
 $('smoothVal').textContent=e.target.value+'%';
};

$('start').onclick=async()=>{
 $('start').disabled=true;
 $('message').textContent='マイクに接続しています...';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPS接続が必要です');
  stream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:false,
    noiseSuppression:false,
    autoGainControl:false
   }
  });
  audio=new(window.AudioContext||window.webkitAudioContext)();
  await audio.resume();
  analyser=audio.createAnalyser();
  analyser.fftSize=4096;
  analyser.minDecibels=-100;
  analyser.maxDecibels=-20;
  analyser.smoothingTimeConstant=smoothing;
  freq=new Uint8Array(analyser.frequencyBinCount);
  wave=new Uint8Array(analyser.fftSize);
  audio.createMediaStreamSource(stream).connect(analyser);
  $('status').textContent='● LIVE';
  $('start').textContent='● 接続中';
  $('stop').disabled=false;
  $('message').textContent='マイク接続中。音楽を流してください。';
 }catch(e){
  $('status').textContent='● ERROR';
  $('message').textContent='マイクを使用できません: '+e.message;
  $('start').disabled=false;
 }
};

$('stop').onclick=()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());
 if(audio)audio.close();
 audio=null;stream=null;analyser=null;
 $('status').textContent='● STANDBY';
 $('start').disabled=false;
 $('start').textContent='▶ マイク開始';
 $('stop').disabled=true;
 $('message').textContent='マイク停止中です。';
};

$('full').onclick=async()=>{
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){
  $('message').textContent='全画面表示に対応していません。';
 }
};
})();
</script>
</body>
</html>
