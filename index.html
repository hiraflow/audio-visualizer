
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b16">
<title>Audio Visualizer Pro</title>

<style>
*{box-sizing:border-box}

html{
 min-height:100%;
 overflow-y:auto;
}

body{
 margin:0;
 min-height:100vh;
 min-height:100dvh;
 background:#080b16;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 overflow-x:hidden;
 overflow-y:auto;
 -webkit-overflow-scrolling:touch;
 touch-action:pan-y;
}

header{
 padding:15px 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

h1{font-size:18px;margin:0}
#status{font-size:11px;color:#8292b5}

main{
 width:100%;
 padding:0 14px calc(30px + env(safe-area-inset-bottom));
}

canvas{
 width:100%;
 height:clamp(220px,38vh,360px);
 display:block;
 background:radial-gradient(ellipse at center,#151d38,#080b16 75%);
 border-radius:18px;
}

.controls{
 margin-top:12px;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:6px;
}

button{
 min-width:0;
 border:1px solid #303b5b;
 background:#151d35;
 color:white;
 padding:12px 4px;
 border-radius:10px;
 font-size:12px;
}

button.active{
 background:#334c91;
 border-color:#789cff;
}

#start{
 grid-column:span 4;
 background:#385bd0;
 border:0;
 font-weight:bold;
}

.meters{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:8px;
 margin-top:13px;
}

.meter,.settings{
 background:#131a2d;
 border-radius:12px;
 padding:10px;
 min-width:0;
}

.meter label{
 font-size:11px;
 color:#a8b5d2;
}

.track{
 height:7px;
 background:#29334d;
 border-radius:8px;
 margin-top:8px;
 overflow:hidden;
}

.fill{
 height:100%;
 width:0%;
 border-radius:8px;
 background:#8baaff;
 transition:width .04s;
}

.value{
 font-size:17px;
 margin-top:5px;
 font-weight:600;
}

.settings{
 margin-top:13px;
 padding:13px;
}

.setting{margin:12px 0}

.setting div{
 display:flex;
 justify-content:space-between;
 gap:8px;
 font-size:12px;
 color:#b8c5df;
}

input[type=range]{
 width:100%;
 accent-color:#829fff;
}

#freq{
 font-size:11px;
 color:#8292b5;
 text-align:center;
 margin-top:9px;
}

.input-meter{
 margin-top:13px;
 background:#131a2d;
 padding:13px;
 border-radius:12px;
}

.input-head{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 color:#b8c5df;
}

.small{
 font-size:10px;
 color:#8292b5;
 margin-top:6px;
}
</style>
</head>

<body>

<header>
 <h1>Audio Visualizer Pro</h1>
 <span id="status">マイク未接続</span>
</header>

<main>

 <canvas id="visual"></canvas>

 <div class="controls">
  <button id="start">● マイクを接続</button>
  <button class="active" data-mode="spectrum">スペクトラム</button>
  <button data-mode="circle">サークル</button>
  <button data-mode="wave">ウェーブ</button>
  <button data-mode="particles">パーティクル</button>
 </div>

 <div class="meters">

  <div class="meter">
   <label>LOW / 低音</label>
   <div class="track"><div class="fill" id="lowbar"></div></div>
   <div class="value" id="lowval">0%</div>
   <div class="small">35〜250Hz</div>
  </div>

  <div class="meter">
   <label>MID / 中音</label>
   <div class="track"><div class="fill" id="midbar"></div></div>
   <div class="value" id="midval">0%</div>
   <div class="small">250Hz〜3.5kHz</div>
  </div>

  <div class="meter">
   <label>HIGH / 高音</label>
   <div class="track"><div class="fill" id="highbar"></div></div>
   <div class="value" id="highval">0%</div>
   <div class="small">3.5〜12kHz</div>
  </div>

 </div>

 <div class="input-meter">
  <div class="input-head">
   <span>実際のマイク入力レベル</span>
   <strong id="inputval">0%</strong>
  </div>
  <div class="track"><div class="fill" id="inputbar"></div></div>
  <div class="small">マイクが拾っている音の強さ</div>
 </div>

 <div id="freq">周波数解析：35Hz〜12kHz</div>

 <div class="settings">

  <div class="setting">
   <div>
    <span>マイク感度（表示感度）</span>
    <strong id="sensval">50%</strong>
   </div>
   <input id="sensitivity" type="range" min="0" max="100" value="50">
  </div>

  <div class="setting">
   <div>
    <span>低音ブースト</span>
    <strong id="bassval">150%</strong>
   </div>
   <input id="bass" type="range" min="50" max="300" value="150">
  </div>

  <div class="setting">
   <div>
    <span>高音ブースト</span>
    <strong id="trebleval">130%</strong>
   </div>
   <input id="treble" type="range" min="50" max="300" value="130">
  </div>

  <div class="setting">
   <div>
    <span>滑らかさ</span>
    <strong id="smoothval">65%</strong>
   </div>
   <input id="smooth" type="range" min="10" max="95" value="65">
  </div>

 </div>

</main>

<script>
const canvas=document.getElementById("visual");
const ctx=canvas.getContext("2d");

let audioCtx,analyser,source,stream;
let freqData,timeData;
let running=false;
let mode="spectrum";

let low=0,mid=0,high=0;
let particles=[];

let sensitivity=.5;
let bassBoost=1.5;
let trebleBoost=1.3;
let smooth=.65;

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;

 canvas.width=Math.round(w*dpr);
 canvas.height=Math.round(h*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);

if("ResizeObserver" in window){
 new ResizeObserver(resize).observe(canvas);
}

resize();

function slider(id,label,callback){
 const el=document.getElementById(id);
 const out=document.getElementById(label);

 el.addEventListener("input",()=>{
  const value=Number(el.value);
  callback(value/100);
  out.textContent=value+"%";
 });
}

slider("sensitivity","sensval",v=>sensitivity=v);
slider("bass","bassval",v=>bassBoost=v);
slider("treble","trebleval",v=>trebleBoost=v);
slider("smooth","smoothval",v=>smooth=v);

document.querySelectorAll("[data-mode]").forEach(b=>{
 b.addEventListener("click",()=>{
  mode=b.dataset.mode;

  document.querySelectorAll("[data-mode]").forEach(x=>{
   x.classList.toggle("active",x===b);
  });
 });
});

// マイク接続
document.getElementById("start").addEventListener("click",async()=>{
 if(running)return;

 const button=document.getElementById("start");

 try{
  button.textContent="接続中...";

  stream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:false,
    noiseSuppression:false,
    autoGainControl:false
   }
  });

  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();

  source=audioCtx.createMediaStreamSource(stream);

  analyser=audioCtx.createAnalyser();
  analyser.fftSize=8192;
  analyser.minDecibels=-100;
  analyser.maxDecibels=-15;
  analyser.smoothingTimeConstant=.2;

  // 音量増幅なし。マイク入力を直接解析する
  source.connect(analyser);

  freqData=new Uint8Array(analyser.frequencyBinCount);
  timeData=new Uint8Array(analyser.fftSize);

  running=true;

  document.getElementById("status").textContent="● LIVE";
  button.textContent="マイク接続中";

  draw();

 }catch(e){
  button.textContent="● マイクを接続";
  document.getElementById("status").textContent="接続エラー";

  alert("マイクを使用できません。\nSafariのマイク許可を確認してください。\n"+e.message);
 }
});

function clamp(v,min=0,max=1){
 return Math.max(min,Math.min(max,v));
}

// 周波数帯の音量を解析
function getBand(minHz,maxHz,boost){

 const binHz=audioCtx.sampleRate/analyser.fftSize;

 const start=Math.max(1,Math.floor(minHz/binHz));
 const end=Math.min(freqData.length-1,Math.ceil(maxHz/binHz));

 let sum=0;
 let count=0;

 for(let i=start;i<=end;i++){

  const db=analyser.minDecibels+
   (freqData[i]/255)*
   (analyser.maxDecibels-analyser.minDecibels);

  const amplitude=Math.pow(10,db/20);

  sum+=amplitude*amplitude;
  count++;
 }

 const rms=count?Math.sqrt(sum/count):0;
 const db=20*Math.log10(Math.max(rms,.000001));

 let level=clamp((db+78)/60);

 // 50%を標準感度とする
 level=clamp(level*sensitivity*2*boost);

 return level;
}

// 実際のマイク入力レベル
function getInputLevel(){

 analyser.getByteTimeDomainData(timeData);

 let sum=0;

 for(let i=0;i<timeData.length;i++){
  const v=(timeData[i]-128)/128;
  sum+=v*v;
 }

 const rms=Math.sqrt(sum/timeData.length);
 const db=20*Math.log10(Math.max(rms,.000001));

 return Math.round(clamp((db+60)/54)*100);
}

function updateMeter(name,value){

 const percent=Math.round(clamp(value)*100);

 document.getElementById(name+"bar").style.width=percent+"%";
 document.getElementById(name+"val").textContent=percent+"%";
}

function analyze(){

 analyser.getByteFrequencyData(freqData);

 const l=getBand(35,250,bassBoost);
 const m=getBand(250,3500,1);
 const h=getBand(3500,12000,trebleBoost);

 const attack=.25;
 const release=smooth;

 function smoothValue(oldValue,newValue){
  const factor=newValue>oldValue?attack:release;
  return oldValue*factor+newValue*(1-factor);
 }

 low=smoothValue(low,l);
 mid=smoothValue(mid,m);
 high=smoothValue(high,h);

 updateMeter("low",low);
 updateMeter("mid",mid);
 updateMeter("high",high);

 const input=getInputLevel();

 document.getElementById("inputbar").style.width=input+"%";
 document.getElementById("inputval").textContent=input+"%";
}

function frequencyColor(hz){
 if(hz<250)return "#6e8fff";
 if(hz<3500)return "#a17dff";
 return "#45d9e8";
}

// スペクトラム
function drawSpectrum(w,h){

 const bars=110;
 const gap=2;
 const bw=w/bars-gap;

 const minHz=35;
 const maxHz=12000;

 for(let j=0;j<bars;j++){

  const f1=minHz*Math.pow(maxHz/minHz,j/bars);
  const f2=minHz*Math.pow(maxHz/minHz,(j+1)/bars);

  const i1=Math.max(1,Math.floor(f1*analyser.fftSize/audioCtx.sampleRate));

  const i2=Math.min(freqData.length-1,
   Math.max(i1+1,Math.ceil(f2*analyser.fftSize/audioCtx.sampleRate)));

  let sum=0;
  let count=0;

  for(let i=i1;i<=i2;i++){

   const db=analyser.minDecibels+
    (freqData[i]/255)*
    (analyser.maxDecibels-analyser.minDecibels);

   sum+=Math.pow(10,db/20)**2;
   count++;
  }

  const rms=count?Math.sqrt(sum/count):0;
  const db=20*Math.log10(Math.max(rms,.000001));

  let v=clamp((db+78)/60*sensitivity*2);

  if(f1<250)v*=bassBoost;
  else if(f1>=3500)v*=trebleBoost;

  v=clamp(v);

  const bh=v*h*.88;

  ctx.fillStyle=frequencyColor(f1);
  ctx.fillRect(j*(bw+gap),h-bh,bw,bh);
 }
}

// サークル
function drawCircle(w,h){

 const cx=w/2;
 const cy=h/2;
 const radius=Math.min(w,h)*.22;
 const count=180;

 for(let i=0;i<count;i++){

  const index=Math.floor(i/count*freqData.length);
  const v=freqData[index]/255;

  const angle=i/count*Math.PI*2;
  const length=radius+v*sensitivity*180;

  ctx.strokeStyle=frequencyColor(
   index*audioCtx.sampleRate/analyser.fftSize
  );

  ctx.lineWidth=2;
  ctx.beginPath();

  ctx.moveTo(
   cx+Math.cos(angle)*radius,
   cy+Math.sin(angle)*radius
  );

  ctx.lineTo(
   cx+Math.cos(angle)*length,
   cy+Math.sin(angle)*length
  );

  ctx.stroke();
 }

 ctx.beginPath();
 ctx.arc(cx,cy,radius,0,Math.PI*2);
 ctx.strokeStyle="#829fff";
 ctx.lineWidth=2;
 ctx.stroke();
}

// ウェーブ
function drawWave(w,h){

 analyser.getByteTimeDomainData(timeData);

 const step=Math.max(1,Math.floor(timeData.length/500));

 ctx.beginPath();

 for(let i=0;i<timeData.length;i+=step){

  const x=i/timeData.length*w;
  const y=(timeData[i]/255)*h;

  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 }

 ctx.strokeStyle="#82b9ff";
 ctx.lineWidth=2;
 ctx.stroke();
}

// パーティクル
function drawParticles(w,h){

 const energy=(low+mid+high)/3;

 if(energy>.08&&particles.length<180){

  for(let i=0;i<Math.ceil(energy*8);i++){

   particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-.5)*2,
    vy:(Math.random()-.5)*2,
    life:1,
    r:Math.random()*3+1
   });
  }
 }

 particles=particles.filter(p=>p.life>0);

 for(const p of particles){

  p.x+=p.vx;
  p.y+=p.vy;
  p.life-=.009;

  ctx.globalAlpha=p.life;
  ctx.fillStyle="#8caaff";

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
}

function draw(){

 if(!running)return;

 requestAnimationFrame(draw);

 analyze();

 const w=canvas.clientWidth;
 const h=canvas.clientHeight;

 ctx.clearRect(0,0,w,h);

 if(mode==="spectrum")drawSpectrum(w,h);
 if(mode==="circle")drawCircle(w,h);
 if(mode==="wave")drawWave(w,h);
 if(mode==="particles")drawParticles(w,h);
}
</script>

</body>
</html>
