
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio Visualizer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080c16;
  color: #edf2ff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  padding: 16px;
  overflow-x: hidden;
  overflow-y: auto;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

header {
  margin-bottom: 16px;
}

header h1 {
  font-size: 22px;
  margin: 0 0 5px;
  letter-spacing: 1px;
}

header p {
  color: #7f8ba8;
  font-size: 12px;
  margin: 0;
}

.visual-card {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: #080c16;
  border: 1px solid #202b43;
  box-shadow: 0 10px 40px #0006;
  margin-bottom: 16px;
}

.visual-area {
  position: relative;
  width: 100%;
  height: 340px;
  min-height: 240px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 100%, #14264b 0%, #0a1020 48%, #080c16 100%);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.view-button {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 10;
  border: 1px solid #ffffff25;
  background: #101a30cc;
  color: white;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  backdrop-filter: blur(10px);
}

.status {
  padding: 12px 16px;
  color: #a5b4d3;
  font-size: 12px;
  border-top: 1px solid #ffffff10;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #64748b;
  margin-right: 7px;
}

.status-dot.active {
  background: #36e6ae;
  box-shadow: 0 0 10px #36e6ae;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

button {
  cursor: pointer;
}

.main-button {
  flex: 1;
  min-width: 130px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  background: linear-gradient(135deg, #3568ed, #7548d9);
}

.secondary-button {
  flex: 1;
  min-width: 130px;
  padding: 14px;
  border: 1px solid #34415d;
  border-radius: 12px;
  color: #dce7ff;
  font-size: 14px;
  background: #172238;
}

.menu-panel {
  display: block;
}

.card {
  background: #111a2c;
  border: 1px solid #24324c;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

.card h2 {
  font-size: 15px;
  margin: 0 0 18px;
}

.setting {
  margin-bottom: 20px;
}

.setting:last-child {
  margin-bottom: 0;
}

.setting-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-bottom: 10px;
  color: #c9d5ee;
}

.setting-value {
  color: #7ea9ff;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: #668fff;
  height: 6px;
}

.meter-row {
  margin: 14px 0;
}

.meter-head {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #b9c6df;
  margin-bottom: 7px;
}

.meter-bg {
  height: 9px;
  border-radius: 20px;
  background: #26334c;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 0%;
  border-radius: 20px;
  transition: width .06s linear;
  background: linear-gradient(90deg, #3977ff, #36e6c0);
  box-shadow: 0 0 10px #398bff80;
}

.frequency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.frequency-item {
  min-width: 0;
}

.frequency-item .meter-bg {
  height: 7px;
}

.frequency-item .meter-fill {
  background: linear-gradient(90deg, #4779ff, #b17aff);
}

.frequency-item:nth-child(2) .meter-fill {
  background: linear-gradient(90deg, #29c6d8, #5b8cff);
}

.frequency-item:nth-child(3) .meter-fill {
  background: linear-gradient(90deg, #a16bff, #ff78bc);
}

.frequency-item small {
  display: block;
  font-size: 11px;
  color: #8796b5;
  margin-top: 6px;
}

/* Fullscreen */

body.fullscreen-mode {
  padding: 0;
  overflow: hidden;
  background: #080c16;
}

.fullscreen-mode .container {
  width: 100%;
  max-width: none;
  height: 100dvh;
  margin: 0;
}

.fullscreen-mode header {
  display: none;
}

.fullscreen-mode .visual-card {
  position: fixed;
  inset: 0;
  z-index: 100;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 0;
  background: #080c16;
}

.fullscreen-mode .visual-area {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: none;
  border-radius: 0;
}

.fullscreen-mode .status,
.fullscreen-mode .controls {
  display: none;
}

.fullscreen-mode .menu-panel {
  display: none;
}

.fullscreen-mode.menu-open .menu-panel {
  display: block;
  position: fixed;
  z-index: 200;
  top: calc(58px + env(safe-area-inset-top));
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(360px, calc(100vw - 24px));
  max-height: none;
  overflow-y: auto;
  padding: 8px;
  background: #0c1425ee;
  border: 1px solid #ffffff25;
  border-radius: 16px;
  backdrop-filter: blur(18px);
}

.fullscreen-mode .menu-panel .card {
  background: #111a2cf2;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .visual-area {
    height: 290px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Audio Visualizer</h1>
  <p>Microphone Spectrum Analyzer</p>
</header>

<div class="visual-card">
  <div class="visual-area" id="visualArea">
    <canvas id="visualizer"></canvas>
    <button class="view-button" id="viewBtn">全画面</button>
  </div>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">マイク未接続</span>
  </div>
</div>

<div class="controls">
  <button class="main-button" id="startBtn">マイク開始</button>
  <button class="secondary-button" id="reconnectBtn">マイク再取得</button>
</div>

<div class="menu-panel" id="menuPanel">

  <div class="card">
    <h2>ビジュアル設定</h2>

    <div class="setting">
      <div class="setting-head">
        <span>入力レベル</span>
        <span class="setting-value" id="gainValue">50%</span>
      </div>
      <input id="gainSlider" type="range" min="0" max="100" value="50">
    </div>

    <div class="setting">
      <div class="setting-head">
        <span>表示感度</span>
        <span class="setting-value" id="sensitivityValue">70%</span>
      </div>
      <input id="sensitivitySlider" type="range" min="0" max="100" value="70">
    </div>

    <div class="setting">
      <div class="setting-head">
        <span>滑らかさ</span>
        <span class="setting-value" id="smoothValue">65%</span>
      </div>
      <input id="smoothSlider" type="range" min="0" max="95" value="65">
    </div>
  </div>

  <div class="card">
    <h2>マイク入力レベル</h2>
    <div class="meter-head">
      <span>Input</span>
      <span id="inputValue">0%</span>
    </div>
    <div class="meter-bg">
      <div class="meter-fill" id="inputMeter"></div>
    </div>
  </div>

  <div class="card">
    <h2>周波数レベル</h2>

    <div class="frequency-grid">
      <div class="frequency-item">
        <div class="meter-head"><span>Low</span><span id="lowValue">0%</span></div>
        <div class="meter-bg"><div class="meter-fill" id="lowMeter"></div></div>
        <small>35–250 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head"><span>Mid</span><span id="midValue">0%</span></div>
        <div class="meter-bg"><div class="meter-fill" id="midMeter"></div></div>
        <small>250–3500 Hz</small>
      </div>

      <div class="frequency-item">
        <div class="meter-head"><span>High</span><span id="highValue">0%</span></div>
        <div class="meter-bg"><div class="meter-fill" id="highMeter"></div></div>
        <small>3500–12000 Hz</small>
      </div>
    </div>
  </div>

</div>
</div>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const reconnectBtn = document.getElementById("reconnectBtn");
const viewBtn = document.getElementById("viewBtn");

const gainSlider = document.getElementById("gainSlider");
const sensitivitySlider = document.getElementById("sensitivitySlider");
const smoothSlider = document.getElementById("smoothSlider");

const inputMeter = document.getElementById("inputMeter");
const lowMeter = document.getElementById("lowMeter");
const midMeter = document.getElementById("midMeter");
const highMeter = document.getElementById("highMeter");

const inputValue = document.getElementById("inputValue");
const lowValue = document.getElementById("lowValue");
const midValue = document.getElementById("midValue");
const highValue = document.getElementById("highValue");

const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");

let audioContext = null;
let source = null;
let gainNode = null;
let analyser = null;
let inputAnalyser = null;
let stream = null;

let frequencyData = null;
let inputData = null;

let bars = [];
let peaks = [];
let particles = [];

let smoothBands = { low: 0, mid: 0, high: 0 };
let currentBass = 0;
let animationFrame = null;

let width = 0;
let height = 0;
let dpr = 1;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = rect.width;
  height = rect.height;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.max(32, Math.floor(width / 7));

  bars = Array(count).fill(0);
  peaks = Array(count).fill(0);
}

const resizeObserver = new ResizeObserver(resizeCanvas);
resizeObserver.observe(document.getElementById("visualArea"));
window.addEventListener("resize", resizeCanvas);

function getGainFromPercent(percent) {
  if (percent <= 50) return percent / 50 * 2;
  return 2 + (percent - 50) / 50;
}

function updateSettings() {
  document.getElementById("gainValue").textContent =
    gainSlider.value + "%";

  document.getElementById("sensitivityValue").textContent =
    sensitivitySlider.value + "%";

  document.getElementById("smoothValue").textContent =
    smoothSlider.value + "%";

  if (gainNode) {
    gainNode.gain.setTargetAtTime(
      getGainFromPercent(Number(gainSlider.value)),
      audioContext.currentTime,
      0.05
    );
  }
}

gainSlider.addEventListener("input", updateSettings);
sensitivitySlider.addEventListener("input", updateSettings);
smoothSlider.addEventListener("input", updateSettings);

function setStatus(active, message) {
  statusText.textContent = message;
  statusDot.classList.toggle("active", active);
}

async function stopMicrophone() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  if (audioContext) {
    try {
      await audioContext.close();
    } catch (e) {}
    audioContext = null;
  }

  source = null;
  gainNode = null;
  analyser = null;
  inputAnalyser = null;
}

async function startMicrophone() {
  startBtn.disabled = true;
  reconnectBtn.disabled = true;
  startBtn.textContent = "接続中...";
  setStatus(false, "マイクを取得しています...");

  try {
    await stopMicrophone();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    source = audioContext.createMediaStreamSource(stream);

    inputAnalyser = audioContext.createAnalyser();
    inputAnalyser.fftSize = 2048;
    inputAnalyser.smoothingTimeConstant = 0.3;

    gainNode = audioContext.createGain();
    gainNode.gain.value =
      getGainFromPercent(Number(gainSlider.value));

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 8192;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -15;
    analyser.smoothingTimeConstant = 0.2;

    source.connect(inputAnalyser);
    source.connect(gainNode);
    gainNode.connect(analyser);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
    inputData = new Float32Array(inputAnalyser.fftSize);

    setStatus(true, "マイク接続中");
    startBtn.textContent = "マイク接続済み";

  } catch (error) {
    console.error(error);
    setStatus(false, "マイクを取得できませんでした");
    startBtn.textContent = "マイク開始";
    alert("マイクを取得できませんでした。Safariのマイク許可設定を確認してください。");
  } finally {
    startBtn.disabled = false;
    reconnectBtn.disabled = false;
  }
}

startBtn.addEventListener("click", async () => {
  if (!stream) {
    await startMicrophone();
  }
});

reconnectBtn.addEventListener("click", startMicrophone);

function getFrequencyIndex(hz) {
  return Math.round(hz * analyser.fftSize / audioContext.sampleRate);
}

function getBandLevel(data, minHz, maxHz) {
  const min = Math.max(0, getFrequencyIndex(minHz));
  const max = Math.min(data.length - 1, getFrequencyIndex(maxHz));

  let sum = 0;
  let count = 0;

  for (let i = min; i <= max; i++) {
    const value = data[i] / 255;
    sum += value * value;
    count++;
  }

  if (!count) return 0;

  return Math.sqrt(sum / count);
}

function updateMeters() {
  if (!inputAnalyser || !analyser) return;

  inputAnalyser.getFloatTimeDomainData(inputData);

  let sum = 0;
  for (let i = 0; i < inputData.length; i++) {
    sum += inputData[i] * inputData[i];
  }

  const rms = Math.sqrt(sum / inputData.length);
  const db = 20 * Math.log10(Math.max(rms, 0.000001));

  const inputLevel = Math.max(0, Math.min(100, (db + 60) * 2));

  inputMeter.style.width = inputLevel + "%";
  inputValue.textContent = Math.round(inputLevel) + "%";

  const low = getBandLevel(frequencyData, 35, 250);
  const mid = getBandLevel(frequencyData, 250, 3500);
  const high = getBandLevel(frequencyData, 3500, 12000);

  const smoothing = Number(smoothSlider.value) / 100 * 0.9;

  smoothBands.low = smoothBands.low * smoothing + low * (1 - smoothing);
  smoothBands.mid = smoothBands.mid * smoothing + mid * (1 - smoothing);
  smoothBands.high = smoothBands.high * smoothing + high * (1 - smoothing);

  const toPercent = v => Math.min(100, v * 180);

  const lowPercent = toPercent(smoothBands.low);
  const midPercent = toPercent(smoothBands.mid);
  const highPercent = toPercent(smoothBands.high);

  lowMeter.style.width = lowPercent + "%";
  midMeter.style.width = midPercent + "%";
  highMeter.style.width = highPercent + "%";

  lowValue.textContent = Math.round(lowPercent) + "%";
  midValue.textContent = Math.round(midPercent) + "%";
  highValue.textContent = Math.round(highPercent) + "%";

  currentBass = smoothBands.low;
}

function drawBackground(time) {
  const bass = Math.min(1, currentBass * 5);
  const pulse = bass * 0.35;

  const gradient = ctx.createRadialGradient(
    width / 2,
    height * 0.85,
    10,
    width / 2,
    height * 0.85,
    height * 0.9
  );

  gradient.addColorStop(0, `rgba(42, 95, 210, ${0.08 + pulse})`);
  gradient.addColorStop(0.5, `rgba(40, 60, 140, ${0.04 + pulse * 0.3})`);
  gradient.addColorStop(1, "#080c16");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  // 背景の光の波紋
  const radius = 50 + bass * 100 + Math.sin(time * 0.001) * 10;

  ctx.beginPath();
  ctx.arc(width / 2, height * 0.82, radius, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(75, 140, 255, ${0.05 + pulse * 0.3})`;
  ctx.lineWidth = 2 + bass * 5;
  ctx.stroke();
}

function drawParticles(time) {
  if (currentBass > 0.025 && Math.random() < 0.35) {
    particles.push({
      x: Math.random() * width,
      y: height * (0.55 + Math.random() * 0.4),
      size: 1 + Math.random() * 2,
      life: 1,
      speed: 0.4 + Math.random() * 1.2
    });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.y -= p.speed;
    p.life -= 0.009;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(110, 170, 255, ${p.life * 0.6})`;
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  }

  if (particles.length > 100) particles.splice(0, 10);
}

function drawSpectrum(time) {
  if (!analyser || !frequencyData) {
    drawIdle(time);
    return;
  }

  analyser.getByteFrequencyData(frequencyData);
  updateMeters();

  const sensitivity = Number(sensitivitySlider.value) / 100;
  const smooth = Number(smoothSlider.value) / 100;

  const count = bars.length;
  const gap = Math.max(2, width / count * 0.22);
  const barWidth = width / count - gap;

  const centerY = height * 0.83;
  const maxHeight = height * 0.67;

  drawBackground(time);
  drawParticles(time);

  const minHz = 35;
  const maxHz = 12000;

  for (let i = 0; i < count; i++) {
    const position = i / count;

    const hz = minHz * Math.pow(maxHz / minHz, position);
    const index = Math.min(
      frequencyData.length - 1,
      Math.max(0, Math.round(hz * analyser.fftSize / audioContext.sampleRate))
    );

    let value = frequencyData[index] / 255;

    // 低音と高音の存在感を調整
    const bassBoost = position < 0.25 ? 1.35 : 1;
    const trebleBoost = position > 0.75 ? 1.18 : 1;

    value *= bassBoost * trebleBoost;
    value = Math.min(1, value * (0.35 + sensitivity * 2.4));

    // 周囲の周波数を少し混ぜて滑らかにする
    if (index > 1 && index < frequencyData.length - 2) {
      const neighbor =
        (frequencyData[index - 1] +
         frequencyData[index + 1]) / 510;

      value = value * 0.78 + neighbor * 0.22;
      value *= (0.8 + sensitivity * 0.4);
    }

    bars[i] = bars[i] * smooth * 0.65 + value * (1 - smooth * 0.65);

    const barHeight = Math.max(2, bars[i] * maxHeight);

    peaks[i] = Math.max(
      bars[i],
      peaks[i] - 0.004 - (1 - smooth) * 0.006
    );

    const x = i * (barWidth + gap);
    const y = centerY - barHeight;

    const hue = 215 + position * 105;

    // バー本体のグラデーション
    const gradient = ctx.createLinearGradient(0, centerY, 0, y);

    gradient.addColorStop(0, `hsla(${hue}, 100%, 62%, 0.95)`);
    gradient.addColorStop(0.5, `hsla(${hue + 15}, 100%, 67%, 0.9)`);
    gradient.addColorStop(1, `hsla(${hue + 35}, 100%, 78%, 0.8)`);

    // 発光
    ctx.shadowBlur = 10 + bars[i] * 24;
    ctx.shadowColor = `hsla(${hue}, 100%, 65%, 0.9)`;

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(x, y, barWidth, barHeight, 4);
    ctx.fill();

    ctx.shadowBlur = 0;

    // ピーク表示
    const peakY = centerY - peaks[i] * maxHeight;

    ctx.fillStyle = `hsla(${hue + 30}, 100%, 85%, 0.9)`;
    ctx.fillRect(x, peakY - 2, barWidth, 2);

    // 下側の反射
    const reflection = ctx.createLinearGradient(
      0, centerY, 0, centerY + barHeight * 0.38
    );

    reflection.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.2)`);
    reflection.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);

    ctx.fillStyle = reflection;
    ctx.fillRect(x, centerY + 3, barWidth, barHeight * 0.38);
  }

  // 中央の光のライン
  const lineGradient = ctx.createLinearGradient(0, 0, width, 0);
  lineGradient.addColorStop(0, "rgba(70,120,255,0)");
  lineGradient.addColorStop(0.5, "rgba(120,190,255,0.9)");
  lineGradient.addColorStop(1, "rgba(70,120,255,0)");

  ctx.shadowBlur = 14;
  ctx.shadowColor = "#4f9fff";
  ctx.strokeStyle = lineGradient;
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.moveTo(0, centerY);
  ctx.lineTo(width, centerY);
  ctx.stroke();

  ctx.shadowBlur = 0;

  // 低音に連動する中央の光
  const bassGlow = Math.min(1, currentBass * 6);

  const glow = ctx.createRadialGradient(
    width / 2, centerY, 0,
    width / 2, centerY, width * 0.55
  );

  glow.addColorStop(0, `rgba(80,140,255,${bassGlow * 0.16})`);
  glow.addColorStop(1, "rgba(80,140,255,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);
}

function drawIdle(time) {
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, width, height);

  const centerX = width / 2;
  const centerY = height * 0.7;

  const pulse = 1 + Math.sin(time * 0.002) * 0.04;

  ctx.beginPath();
  ctx.arc(centerX, centerY, 30 * pulse, 0, Math.PI * 2);
  ctx.strokeStyle = "#477bdf";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#477bdf";
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#91a9d8";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("MICROPHONE STANDBY", centerX, centerY + 65);
}

function animate(time) {
  ctx.clearRect(0, 0, width, height);
  drawSpectrum(time);
  animationFrame = requestAnimationFrame(animate);
}

function startAnimation() {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(animate);
}

viewBtn.addEventListener("click", () => {
  if (!document.body.classList.contains("fullscreen-mode")) {
    document.body.classList.add("fullscreen-mode");
    viewBtn.textContent = "メニュー";
  } else if (!document.body.classList.contains("menu-open")) {
    document.body.classList.add("menu-open");
    viewBtn.textContent = "メニューを閉じる";
  } else {
    document.body.classList.remove("menu-open");
    viewBtn.textContent = "メニュー";
  }
});

document.addEventListener("click", event => {
  if (event.target.id === "viewBtn") return;

  if (
    document.body.classList.contains("fullscreen-mode") &&
    document.body.classList.contains("menu-open") &&
    event.target.closest(".menu-panel")
  ) {
    return;
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    document.body.classList.remove("fullscreen-mode", "menu-open");
    viewBtn.textContent = "全画面";
  }
});

updateSettings();
resizeCanvas();
startAnimation();
</script>
</body>
</html>
